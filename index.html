<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Sổ Thu Chi & Phân Bổ Dòng Tiền Gia Đình</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800">
  <div id="root">
    <div style="display:flex; height:100vh; align-items:center; justify-content:center; font-family:sans-serif; color:#64748b; font-size:14px; font-weight:600;">
      Đang tải ứng dụng...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const STORAGE_KEY = 'GIA_DINH_4PHEU_FULL_CONFIG_V1';

    const formatVND = (num, hidden = false) => {
      if (hidden) return '•••••• ₫';
      return new Intl.NumberFormat('vi-VN').format(Math.round(num || 0)) + ' ₫';
    };

    const parseNum = (val) => {
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      const clean = String(val || '').replace(/[^0-9]/g, '');
      return parseInt(clean, 10) || 0;
    };

    const formatInputNumber = (val) => {
      const n = parseNum(val);
      return n === 0 ? '' : new Intl.NumberFormat('vi-VN').format(n);
    };

    // CẤU HÌNH MẶC ĐỊNH BAN ĐẦU (MỌI MỤC ĐỀU CÓ THỂ SỬA TRONG TAB CÀI ĐẶT)
    const DEFAULT_CONFIG = {
      protectedSavings: 320000000,
      babySavingsFund: 20000000,
      incomeExpected: {
        mySalary: 12500000,
        husbandTransfer: 10000000,
        roomRent: 2500000
      },
      livingBudget: 11000000,
      livingBreakdown: [
        { id: 'b1', name: 'Ăn uống & Đi chợ', limit: 4500000 },
        { id: 'b2', name: 'Em bé & Con cái', limit: 2500000 },
        { id: 'b3', name: 'Điện nước & Dịch vụ', limit: 2000000 },
        { id: 'b4', name: 'Chi tiêu cá nhân', limit: 1000000 },
        { id: 'b5', name: 'Dự phòng phát sinh', limit: 1000000 }
      ],
      schoolConfig: {
        schoolName: 'Mầm non Edison Reggio',
        tuition: 3150000,
        mealDays: 26,
        mealRate: 50000,
        learningMaterials: 100000,
        acFee: 100000,
        oneTimeFees: 1520000,
        oneTimeTitle: 'CSVC & Sự kiện đầu năm',
        oneTimeSource: 'baby_savings'
      },
      insuranceConfig: {
        title: 'Bảo hiểm nhân thọ',
        quarterlyAmount: 0,
        dueMonths: ['11', '02', '05', '08'],
        source: 'baby_savings'
      },
      transactions: []
    };

    function App() {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            return { ...DEFAULT_CONFIG, ...parsed };
          }
        } catch (e) {
          console.error("Lỗi đọc dữ liệu:", e);
        }
        return DEFAULT_CONFIG;
      });

      const [selectedMonth, setSelectedMonth] = useState('2026-11');
      const [activeTab, setActiveTab] = useState('overview'); // 'overview', 'transactions', 'settings'
      const [hideAmounts, setHideAmounts] = useState(false);

      // Modal Thêm Giao Dịch
      const [showModal, setShowModal] = useState(false);
      const [txTitle, setTxTitle] = useState('');
      const [txAmount, setTxAmount] = useState('');
      const [txType, setTxType] = useState('expense'); // 'expense', 'income'
      const [txSource, setTxSource] = useState('monthly_income'); // 'monthly_income', 'baby_savings'
      const [txBucket, setTxBucket] = useState('living11m'); // 'living11m', 'school_regular', 'school_onetime', 'insurance', 'other'
      const [txCat, setTxCat] = useState('Ăn uống & Đi chợ');
      const [txMethod, setTxMethod] = useState('Chuyển khoản');
      const [txDate, setTxDate] = useState(() => {
        const d = new Date();
        return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
      });

      // Lọc danh sách
      const [filterSearch, setFilterSearch] = useState('');
      const [filterSource, setFilterSource] = useState('ALL');

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          console.error("Lỗi lưu:", e);
        }
      }, [state]);

      // Giao dịch tháng hiện tại
      const currentMonthTxs = useMemo(() => {
        if (!Array.isArray(state.transactions)) return [];
        return state.transactions.filter(t => t && t.monthKey === selectedMonth);
      }, [state.transactions, selectedMonth]);

      // 1. Phễu 1: Gói 11M
      const livingTxs = useMemo(() => {
        return currentMonthTxs.filter(t => t.type === 'expense' && (t.bucket === 'living11m' || !t.bucket));
      }, [currentMonthTxs]);

      const livingSpent = useMemo(() => {
        return livingTxs.reduce((sum, t) => sum + (t.amount || 0), 0);
      }, [livingTxs]);

      const livingRemaining = Math.max(0, (state.livingBudget || 11000000) - livingSpent);

      const breakdownStats = useMemo(() => {
        const list = Array.isArray(state.livingBreakdown) ? state.livingBreakdown : DEFAULT_CONFIG.livingBreakdown;
        return list.map(item => {
          const spent = livingTxs
            .filter(t => t.cat === item.name || (t.cat && t.cat.includes(item.name.split(' ')[0])))
            .reduce((sum, t) => sum + (t.amount || 0), 0);
          return {
            ...item,
            spent,
            percent: item.limit > 0 ? Math.min(100, Math.round((spent / item.limit) * 100)) : 0
          };
        });
      }, [state.livingBreakdown, livingTxs]);

      // 2. Phễu 2: Trường học (Tính toán động theo cấu hình người dùng đặt)
      const schoolRegularStandard = useMemo(() => {
        const sc = state.schoolConfig || {};
        return (sc.tuition || 0) + ((sc.mealDays || 0) * (sc.mealRate || 0)) + (sc.learningMaterials || 0) + (sc.acFee || 0);
      }, [state.schoolConfig]);

      const schoolOneTimeAmount = useMemo(() => {
        return state.schoolConfig?.oneTimeFees || 0;
      }, [state.schoolConfig]);

      // 3. Phễu 3: Khoản rút từ tiết kiệm cho bé
      const babySavingsSpentThisMonth = useMemo(() => {
        return currentMonthTxs
          .filter(t => t.type === 'expense' && t.source === 'baby_savings')
          .reduce((sum, t) => sum + (t.amount || 0), 0);
      }, [currentMonthTxs]);

      // 4. Chi từ thu nhập tháng
      const monthlyIncomeExpenses = useMemo(() => {
        return currentMonthTxs
          .filter(t => t.type === 'expense' && t.source !== 'baby_savings')
          .reduce((sum, t) => sum + (t.amount || 0), 0);
      }, [currentMonthTxs]);

      // Thu nhập thực tế
      const totalIncome = useMemo(() => {
        return currentMonthTxs
          .filter(t => t.type === 'income')
          .reduce((sum, t) => sum + (t.amount || 0), 0);
      }, [currentMonthTxs]);

      // Tiết kiệm tích lũy mới
      const estimatedNewSavings = useMemo(() => {
        const inc = totalIncome > 0 ? totalIncome : ((state.incomeExpected?.mySalary || 0) + (state.incomeExpected?.husbandTransfer || 0) + (state.incomeExpected?.roomRent || 0));
        const plannedOut = (state.livingBudget || 11000000) + schoolRegularStandard;
        return Math.max(0, inc - (monthlyIncomeExpenses > 0 ? monthlyIncomeExpenses : plannedOut));
      }, [totalIncome, state.incomeExpected, state.livingBudget, schoolRegularStandard, monthlyIncomeExpenses]);

      // Thẻ tín dụng
      const creditSpent = useMemo(() => {
        return currentMonthTxs
          .filter(t => t.method === 'Thẻ tín dụng' && t.type === 'expense')
          .reduce((sum, t) => sum + (t.amount || 0), 0);
      }, [currentMonthTxs]);

      // Thao tác nhanh
      const handleQuickPaySchoolRegular = () => {
        if (confirm(`Ghi nhận đóng tiền học thường tháng (${formatVND(schoolRegularStandard)}) từ Thu Nhập Tháng?`)) {
          const newTx = {
            id: Date.now(),
            title: `Tiền học thường tháng ${state.schoolConfig?.schoolName || ''} (${selectedMonth})`,
            amount: schoolRegularStandard,
            type: 'expense',
            source: 'monthly_income',
            bucket: 'school_regular',
            cat: 'Em bé & Con cái',
            method: 'Chuyển khoản',
            monthKey: selectedMonth,
            createdAt: txDate
          };
          setState(prev => ({ ...prev, transactions: [newTx, ...(prev.transactions || [])] }));
        }
      };

      const handleQuickPaySchoolOneTime = () => {
        const amt = schoolOneTimeAmount;
        const sourceLabel = state.schoolConfig?.oneTimeSource === 'baby_savings' ? 'Quỹ Tiết Kiệm Của Bé' : 'Thu Nhập Tháng';
        if (confirm(`Ghi nhận đóng "${state.schoolConfig?.oneTimeTitle}" (${formatVND(amt)}) trích từ [${sourceLabel}]?`)) {
          const newTx = {
            id: Date.now(),
            title: `${state.schoolConfig?.oneTimeTitle} (${state.schoolConfig?.schoolName})`,
            amount: amt,
            type: 'expense',
            source: state.schoolConfig?.oneTimeSource || 'baby_savings',
            bucket: 'school_onetime',
            cat: 'Em bé & Con cái',
            method: 'Chuyển khoản',
            monthKey: selectedMonth,
            createdAt: txDate
          };
          setState(prev => ({ ...prev, transactions: [newTx, ...(prev.transactions || [])] }));
        }
      };

      const handleQuickPayInsurance = () => {
        let amt = state.insuranceConfig?.quarterlyAmount || 0;
        if (!amt) {
          const inputAmt = prompt('Nhập số tiền bảo hiểm nhân thọ kỳ này (VNĐ):', '6000000');
          if (!inputAmt) return;
          amt = parseNum(inputAmt);
          setState(prev => ({ ...prev, insuranceConfig: { ...prev.insuranceConfig, quarterlyAmount: amt } }));
        }
        const sourceLabel = state.insuranceConfig?.source === 'baby_savings' ? 'Quỹ Tiết Kiệm Của Bé' : 'Thu Nhập Tháng';
        if (confirm(`Xác nhận đóng Bảo hiểm nhân thọ (${formatVND(amt)}) trích từ [${sourceLabel}]?`)) {
          const newTx = {
            id: Date.now(),
            title: `Đóng phí ${state.insuranceConfig?.title || 'Bảo hiểm nhân thọ'} (Kỳ ${selectedMonth})`,
            amount: amt,
            type: 'expense',
            source: state.insuranceConfig?.source || 'baby_savings',
            bucket: 'insurance',
            cat: 'Bảo hiểm nhân thọ',
            method: 'Chuyển khoản',
            monthKey: selectedMonth,
            createdAt: txDate
          };
          setState(prev => ({ ...prev, transactions: [newTx, ...(prev.transactions || [])] }));
        }
      };

      const handleAddTx = (e) => {
        e.preventDefault();
        const amt = parseNum(txAmount);
        if (amt <= 0 || !txTitle.trim()) return;

        const newTx = {
          id: Date.now(),
          title: txTitle.trim(),
          amount: amt,
          type: txType,
          source: txType === 'expense' ? txSource : 'income',
          bucket: txBucket,
          cat: txCat,
          method: txMethod,
          monthKey: selectedMonth,
          createdAt: txDate
        };

        setState(prev => ({ ...prev, transactions: [newTx, ...(prev.transactions || [])] }));
        setTxTitle('');
        setTxAmount('');
        setShowModal(false);
      };

      const handleDelete = (id) => {
        if (confirm('Xóa khoản này khỏi sổ?')) {
          setState(prev => ({ ...prev, transactions: prev.transactions.filter(t => t.id !== id) }));
        }
      };

      const filteredList = useMemo(() => {
        return currentMonthTxs.filter(t => {
          const matchText = !filterSearch || (t.title && t.title.toLowerCase().includes(filterSearch.toLowerCase()));
          const matchSource = filterSource === 'ALL' ? true : t.source === filterSource;
          return matchText && matchSource;
        });
      }, [currentMonthTxs, filterSearch, filterSource]);

      const monthLabel = `Tháng ${selectedMonth.split('-')[1]}/${selectedMonth.split('-')[0]}`;

      return (
        <div className="flex flex-col min-h-screen bg-[#f8fafc] text-slate-800 pb-20 md:pb-6">
          
          {/* HEADER */}
          <header className="bg-white border-b border-slate-200/80 sticky top-0 z-30 px-4 sm:px-8 py-3.5 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-emerald-600 text-white flex items-center justify-center font-black text-lg shadow-sm shadow-emerald-500/20">
                💎
              </div>
              <div>
                <h1 className="font-extrabold text-slate-900 text-sm sm:text-base leading-tight">Phân Bổ Dòng Tiền Gia Đình</h1>
                <div className="flex items-center gap-1.5 mt-0.5">
                  <span className="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200/50">
                    {monthLabel}
                  </span>
                  <button onClick={() => setHideAmounts(!hideAmounts)} className="text-xs text-slate-400 hover:text-slate-600 p-0.5">
                    {hideAmounts ? '👁️' : '🙈'}
                  </button>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <input 
                type="month"
                value={selectedMonth}
                onChange={(e) => setSelectedMonth(e.target.value)}
                className="bg-slate-50 border border-slate-200 text-xs font-bold text-slate-700 rounded-xl px-2.5 py-1.5 outline-none"
              />
              <button 
                onClick={() => setShowModal(true)}
                className="hidden sm:flex items-center gap-1.5 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all shadow-emerald-500/20"
              >
                <span>+ Ghi Khoản Chi</span>
              </button>
            </div>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-5">
            
            {/* THANH ĐIỀU HƯỚNG TẦNG TRÊN (MÁY TÍNH) */}
            <div className="hidden sm:flex bg-white p-1 rounded-2xl border border-slate-200/80 shadow-xs max-w-lg mx-auto text-xs font-bold">
              <button 
                onClick={() => setActiveTab('overview')}
                className={`flex-1 py-2 rounded-xl transition-all ${activeTab === 'overview' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800'}`}
              >
                📊 Dòng Tiền & Nguồn Chi
              </button>
              <button 
                onClick={() => setActiveTab('transactions')}
                className={`flex-1 py-2 rounded-xl transition-all ${activeTab === 'transactions' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800'}`}
              >
                📝 Lịch Sử Chi Tiêu ({monthTransactions.length})
              </button>
              <button 
                onClick={() => setActiveTab('settings')}
                className={`flex-1 py-2 rounded-xl transition-all ${activeTab === 'settings' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800'}`}
              >
                ⚙️ Tùy Chỉnh Định Mức
              </button>
            </div>

            {/* TAB 1: OVERVIEW */}
            {activeTab === 'overview' && (
              <div className="space-y-4">
                
                {/* KHỐI TIẾT KIỆM NỀN 320M */}
                <div className="bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 rounded-3xl p-5 text-white shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div className="space-y-1">
                    <div className="flex items-center gap-2">
                      <span className="text-[11px] font-extrabold uppercase tracking-wider bg-white/20 px-2.5 py-0.5 rounded-full">
                        🛡️ Tiết Kiệm Nền Tảng (Khóa An Toàn)
                      </span>
                      <span className="text-[10px] bg-emerald-400 text-emerald-950 font-black px-2 py-0.5 rounded-full">Giữ nguyên</span>
                    </div>
                    <div className="text-2xl sm:text-3xl font-black tracking-tight">
                      {formatVND(state.protectedSavings, hideAmounts)}
                    </div>
                    <p className="text-[11px] text-emerald-100">
                      Được khóa bảo vệ, bạn có thể chỉnh con số này trong tab Cài đặt bất kỳ lúc nào.
                    </p>
                  </div>

                  <div className="bg-white/10 backdrop-blur-xs p-3 rounded-2xl border border-white/20 text-right">
                    <span className="text-[11px] text-emerald-100 font-semibold block">Tích lũy mới thêm tháng này:</span>
                    <span className="text-xl font-black text-white">+{formatVND(estimatedNewSavings, hideAmounts)}</span>
                  </div>
                </div>

                {/* KHỐI NGUỒN TIẾT KIỆM CỦA BÉ */}
                <div className="bg-gradient-to-br from-indigo-50 to-purple-50/70 rounded-3xl p-5 border border-purple-200/80 shadow-xs space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <span className="text-[11px] font-extrabold uppercase tracking-wider text-purple-800 bg-purple-100 px-2.5 py-0.5 rounded-full">
                        👶 Nguồn: Quỹ Tiết Kiệm Dành Riêng Cho Bé
                      </span>
                      <h3 className="text-lg font-black text-slate-900 mt-1">
                        Dành Riêng Chi Các Khoản Lớn / Phát Sinh
                      </h3>
                    </div>
                    <div className="text-right">
                      <span className="text-xs text-slate-400 font-bold block">Đã trích tháng này</span>
                      <span className="text-base font-black text-purple-700">-{formatVND(babySavingsSpentThisMonth, hideAmounts)}</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                    {/* Khoản phát sinh trường học */}
                    <div className="p-3.5 rounded-2xl bg-white border border-purple-100 shadow-2xs space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-bold text-slate-800">1. {state.schoolConfig?.oneTimeTitle || 'Phí đầu năm'}</span>
                        <span className="font-black text-slate-900">{formatVND(schoolOneTimeAmount, hideAmounts)}</span>
                      </div>
                      <p className="text-[10px] text-slate-400">Nguồn trích: {state.schoolConfig?.oneTimeSource === 'baby_savings' ? 'Quỹ Tiết Kiệm Bé' : 'Thu nhập tháng'}</p>
                      
                      {currentMonthTxs.some(t => t.bucket === 'school_onetime') ? (
                        <span className="block text-center text-xs font-bold text-emerald-700 bg-emerald-50 py-1.5 rounded-xl">
                          ✓ Đã thanh toán
                        </span>
                      ) : (
                        <button 
                          onClick={handleQuickPaySchoolOneTime}
                          className="w-full py-1.5 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-xs"
                        >
                          Xác Nhận Đóng ({formatVND(schoolOneTimeAmount)})
                        </button>
                      )}
                    </div>

                    {/* Bảo hiểm nhân thọ */}
                    <div className="p-3.5 rounded-2xl bg-white border border-purple-100 shadow-2xs space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-bold text-slate-800">2. {state.insuranceConfig?.title || 'Bảo hiểm nhân thọ'}</span>
                        <span className="font-black text-purple-900">
                          {state.insuranceConfig?.quarterlyAmount > 0 ? formatVND(state.insuranceConfig.quarterlyAmount, hideAmounts) : 'Tùy nhập'}
                        </span>
                      </div>
                      <p className="text-[10px] text-slate-400">Nguồn trích: {state.insuranceConfig?.source === 'baby_savings' ? 'Quỹ Tiết Kiệm Bé' : 'Thu nhập tháng'}</p>
                      
                      {currentMonthTxs.some(t => t.bucket === 'insurance') ? (
                        <span className="block text-center text-xs font-bold text-emerald-700 bg-emerald-50 py-1.5 rounded-xl">
                          ✓ Đã đóng bảo hiểm
                        </span>
                      ) : (
                        <button 
                          onClick={handleQuickPayInsurance}
                          className="w-full py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-xs"
                        >
                          Xác Nhận Đóng Bảo Hiểm
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                {/* KHỐI THU NHẬP HÀNG THÁNG */}
                <div className="space-y-4">
                  {/* Phễu 1: 11 Triệu sinh hoạt */}
                  <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-xs space-y-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <span className="text-[11px] font-extrabold uppercase tracking-wider text-amber-800 bg-amber-100 px-2.5 py-0.5 rounded-full">
                          Quỹ Chi Tiêu Chung ({formatVND(state.livingBudget || 11000000)})
                        </span>
                        <h2 className="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight mt-1.5">
                          Còn lại: <span className="text-emerald-600">{formatVND(livingRemaining, hideAmounts)}</span>
                        </h2>
                      </div>
                      <div className="text-right">
                        <span className="text-xs font-bold text-slate-400 block">Đã xuất</span>
                        <span className="text-lg font-black text-slate-800">{formatVND(livingSpent, hideAmounts)}</span>
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      <div className="w-full bg-slate-100 h-3.5 rounded-full overflow-hidden p-0.5">
                        <div 
                          className={`h-full rounded-full transition-all duration-500 ${livingSpent > (state.livingBudget || 11000000) ? 'bg-rose-500' : 'bg-emerald-500'}`}
                          style={{ width: `${Math.min(100, Math.round((livingSpent / (state.livingBudget || 11000000)) * 100))}%` }}
                        />
                      </div>
                      <div className="flex justify-between items-center text-[11px] font-bold text-slate-500">
                        <span>Đã tiêu: {Math.round((livingSpent / (state.livingBudget || 11000000)) * 100)}%</span>
                        <span>Định mức: {formatVND(state.livingBudget || 11000000, hideAmounts)}</span>
                      </div>
                    </div>

                    {/* Phân rã nhóm con */}
                    <div className="pt-2 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      {breakdownStats.map(item => (
                        <div key={item.id || item.name} className="p-2.5 rounded-xl bg-slate-50/80 border border-slate-100 space-y-1">
                          <div className="flex justify-between items-center text-xs font-bold">
                            <span className="text-slate-800">{item.name}</span>
                            <span className={item.spent > item.limit ? 'text-rose-600 font-extrabold' : 'text-slate-700'}>
                              {formatVND(item.spent, hideAmounts)} <span className="text-slate-400 font-normal">/ {formatVND(item.limit, hideAmounts)}</span>
                            </span>
                          </div>
                          <div className="w-full bg-slate-200/80 h-1.5 rounded-full overflow-hidden">
                            <div 
                              className={`h-full rounded-full transition-all ${item.percent >= 100 ? 'bg-rose-500' : item.percent >= 80 ? 'bg-amber-500' : 'bg-emerald-500'}`}
                              style={{ width: `${item.percent}%` }}
                            />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Phễu 2: Học phí thường tháng */}
                  <div className="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-xs space-y-3">
                    <div className="flex items-center justify-between">
                      <div>
                        <span className="text-[11px] font-extrabold uppercase tracking-wider text-blue-800 bg-blue-100 px-2.5 py-0.5 rounded-full">
                          Tiền Học Thường Tháng Của Bé
                        </span>
                        <h3 className="text-base font-black text-slate-900 mt-1">
                          {state.schoolConfig?.schoolName || 'Mầm non'}
                        </h3>
                      </div>
                      <span className="text-lg font-black text-blue-700">{formatVND(schoolRegularStandard, hideAmounts)}</span>
                    </div>

                    <div className="p-3 bg-blue-50/50 rounded-2xl border border-blue-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                      <div className="space-y-0.5">
                        <span className="text-slate-600 font-semibold block">
                          Học phí ({formatVND(state.schoolConfig?.tuition)}) + Ăn ({state.schoolConfig?.mealDays} ngày x {formatVND(state.schoolConfig?.mealRate)}) + Phí khác ({formatVND((state.schoolConfig?.learningMaterials||0) + (state.schoolConfig?.acFee||0))})
                        </span>
                        <span className="text-[10px] text-slate-400">Trích từ Thu Nhập Tháng. Bạn có thể sửa từng mức phí này trong tab Cài đặt.</span>
                      </div>

                      {currentMonthTxs.some(t => t.bucket === 'school_regular') ? (
                        <span className="text-xs bg-emerald-100 text-emerald-800 font-bold px-3 py-1.5 rounded-xl text-center">
                          ✓ Đã đóng tháng này
                        </span>
                      ) : (
                        <button 
                          onClick={handleQuickPaySchoolRegular}
                          className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-xs text-center"
                        >
                          Xác Nhận Đóng
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                {/* THẺ TÍN DỤNG */}
                <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <span className="text-xl">💳</span>
                    <div>
                      <span className="text-xs font-bold text-slate-800 block">Đã quẹt thẻ tín dụng tháng này</span>
                      <span className="text-[10px] text-slate-400">Thanh toán sao kê vào ngày 20</span>
                    </div>
                  </div>
                  <span className="text-base font-black text-rose-600">{formatVND(creditSpent, hideAmounts)}</span>
                </div>

              </div>
            )}

            {/* TAB 2: GIAO DỊCH */}
            {activeTab === 'transactions' && (
              <div className="bg-white rounded-3xl border border-slate-200/80 shadow-xs overflow-hidden space-y-3">
                <div className="p-4 border-b border-slate-100 space-y-3">
                  <div className="flex flex-col sm:flex-row gap-2 justify-between">
                    <input 
                      type="text" 
                      placeholder="🔍 Tìm tên món (chợ, thịt, bảo hiểm, học phí...)..."
                      value={filterSearch}
                      onChange={(e) => setFilterSearch(e.target.value)}
                      className="px-3.5 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
                    />

                    <select 
                      value={filterSource} 
                      onChange={(e) => setFilterSource(e.target.value)}
                      className="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold text-slate-700"
                    >
                      <option value="ALL">Tất cả nguồn chi</option>
                      <option value="monthly_income">Thu nhập tháng (11M & Học phí thường)</option>
                      <option value="baby_savings">Rút từ tiết kiệm bé (Bảo hiểm & Phí đầu năm)</option>
                    </select>
                  </div>
                </div>

                {filteredList.length === 0 ? (
                  <div className="p-10 text-center text-slate-400 text-xs">Chưa có giao dịch nào phù hợp trong {monthLabel}.</div>
                ) : (
                  <div className="divide-y divide-slate-100 max-h-[600px] overflow-y-auto custom-scroll">
                    {filteredList.map(tx => (
                      <div key={tx.id} className="p-3.5 sm:px-5 flex items-center justify-between hover:bg-slate-50 transition-colors">
                        <div className="flex items-center gap-3 min-w-0">
                          <div className="w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center font-bold text-sm flex-shrink-0">
                            {tx.source === 'baby_savings' ? '👶' : (tx.method === 'Thẻ tín dụng' ? '💳' : (tx.method === 'Chuyển khoản' ? '🏦' : '💵'))}
                          </div>
                          <div className="min-w-0">
                            <p className="font-bold text-slate-900 text-sm truncate">{tx.title}</p>
                            <div className="flex items-center gap-1.5 text-xs text-slate-400 mt-0.5 flex-wrap">
                              <span className="font-semibold text-slate-600">{tx.cat}</span>
                              <span>•</span>
                              <span className="text-[10px] bg-slate-100 px-1.5 py-0.2 rounded font-bold">{tx.method}</span>
                              {tx.source === 'baby_savings' ? (
                                <span className="text-[9px] bg-purple-100 text-purple-800 font-bold px-1.5 py-0.2 rounded">Rút từ tiết kiệm bé</span>
                              ) : (
                                <span className="text-[9px] bg-emerald-50 text-emerald-700 font-bold px-1.5 py-0.2 rounded">Thu nhập tháng</span>
                              )}
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center gap-3 flex-shrink-0">
                          <span className={`font-black text-sm sm:text-base ${tx.source === 'baby_savings' ? 'text-purple-700' : 'text-rose-600'}`}>
                            -{formatVND(tx.amount, hideAmounts)}
                          </span>
                          <button onClick={() => handleDelete(tx.id)} className="text-slate-300 hover:text-rose-500 p-1 text-xs">✕</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: CÀI ĐẶT TÙY Ý MỌI THỨ */}
            {activeTab === 'settings' && (
              <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-xs space-y-6">
                <div>
                  <h3 className="font-bold text-slate-900 text-base">Tùy Ý Cấu Hình Định Mức Tài Chính</h3>
                  <p className="text-xs text-slate-500">Mọi thông số dưới đây bạn đều có thể thay đổi theo ý muốn.</p>
                </div>

                {/* 1. Tiết kiệm nền */}
                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-100 space-y-2">
                  <span className="text-xs font-bold text-slate-800 block">Sổ tiết kiệm nền tảng bảo vệ (VNĐ)</span>
                  <input 
                    type="text"
                    value={formatInputNumber(state.protectedSavings)}
                    onChange={(e) => setState(prev => ({ ...prev, protectedSavings: parseNum(e.target.value) }))}
                    className="w-full px-3 py-2 rounded-xl border border-slate-200 font-bold text-xs bg-white"
                  />
                </div>

                {/* 2. Quỹ sinh hoạt 11M & Nhóm con */}
                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-100 space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-slate-800">Tổng hạn mức Quỹ sinh hoạt chung (VNĐ)</span>
                    <input 
                      type="text"
                      value={formatInputNumber(state.livingBudget)}
                      onChange={(e) => setState(prev => ({ ...prev, livingBudget: parseNum(e.target.value) }))}
                      className="w-40 px-3 py-1.5 rounded-xl border border-slate-200 font-bold text-xs bg-white text-right"
                    />
                  </div>

                  <span className="text-[11px] font-bold text-slate-400 uppercase block pt-1">Định mức 5 nhóm con:</span>
                  <div className="space-y-2">
                    {(state.livingBreakdown || []).map((item, idx) => (
                      <div key={item.id || idx} className="flex items-center gap-2">
                        <input 
                          type="text"
                          value={item.name}
                          onChange={(e) => {
                            const val = e.target.value;
                            setState(prev => ({
                              ...prev,
                              livingBreakdown: prev.livingBreakdown.map((b, i) => i === idx ? { ...b, name: val } : b)
                            }));
                          }}
                          className="flex-1 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold bg-white"
                        />
                        <input 
                          type="text"
                          value={formatInputNumber(item.limit)}
                          onChange={(e) => {
                            const val = parseNum(e.target.value);
                            setState(prev => ({
                              ...prev,
                              livingBreakdown: prev.livingBreakdown.map((b, i) => i === idx ? { ...b, limit: val } : b)
                            }));
                          }}
                          className="w-32 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-bold bg-white text-right"
                        />
                        <span className="text-xs text-slate-400">₫</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 3. Cấu hình tiền học mầm non */}
                <div className="p-4 rounded-2xl bg-blue-50/50 border border-blue-100 space-y-3">
                  <span className="text-xs font-bold text-blue-900 block">Cấu hình biểu phí mầm non</span>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    <div>
                      <label className="text-[10px] text-slate-500 font-bold block mb-1">Tên trường</label>
                      <input 
                        type="text" 
                        value={state.schoolConfig?.schoolName || ''}
                        onChange={(e) => setState(prev => ({ ...prev, schoolConfig: { ...prev.schoolConfig, schoolName: e.target.value } }))}
                        className="w-full px-3 py-1.5 rounded-lg border border-slate-200 bg-white font-semibold"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-500 font-bold block mb-1">Học phí tháng (VNĐ)</label>
                      <input 
                        type="text" 
                        value={formatInputNumber(state.schoolConfig?.tuition)}
                        onChange={(e) => setState(prev => ({ ...prev, schoolConfig: { ...prev.schoolConfig, tuition: parseNum(e.target.value) } }))}
                        className="w-full px-3 py-1.5 rounded-lg border border-slate-200 bg-white font-bold"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-500 font-bold block mb-1">Số ngày ăn trong tháng</label>
                      <input 
                        type="number" 
                        value={state.schoolConfig?.mealDays || 0}
                        onChange={(e) => setState(prev => ({ ...prev, schoolConfig: { ...prev.schoolConfig, mealDays: parseInt(e.target.value, 10) || 0 } }))}
                        className="w-full px-3 py-1.5 rounded-lg border border-slate-200 bg-white font-bold"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-500 font-bold block mb-1">Tiền ăn 1 ngày (VNĐ)</label>
                      <input 
                        type="text" 
                        value={formatInputNumber(state.schoolConfig?.mealRate)}
                        onChange={(e) => setState(prev => ({ ...prev, schoolConfig: { ...prev.schoolConfig, mealRate: parseNum(e.target.value) } }))}
                        className="w-full px-3 py-1.5 rounded-lg border border-slate-200 bg-white font-bold"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-500 font-bold block mb-1">Phí CSVC & Sự kiện đầu năm</label>
                      <input 
                        type="text" 
                        value={formatInputNumber(state.schoolConfig?.oneTimeFees)}
                        onChange={(e) => setState(prev => ({ ...prev, schoolConfig: { ...prev.schoolConfig, oneTimeFees: parseNum(e.target.value) } }))}
                        className="w-full px-3 py-1.5 rounded-lg border border-slate-200 bg-white font-bold"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-500 font-bold block mb-1">Nguồn trích phí đầu năm</label>
                      <select 
                        value={state.schoolConfig?.oneTimeSource || 'baby_savings'}
                        onChange={(e) => setState(prev => ({ ...prev, schoolConfig: { ...prev.schoolConfig, oneTimeSource: e.target.value } }))}
                        className="w-full px-3 py-1.5 rounded-lg border border-slate-200 bg-white font-bold"
                      >
                        <option value="baby_savings">Quỹ Tiết Kiệm Của Bé</option>
                        <option value="monthly_income">Thu Nhập Hàng Tháng</option>
                      </select>
                    </div>
                  </div>
                </div>

                {/* 4. Cấu hình bảo hiểm nhân thọ */}
                <div className="p-4 rounded-2xl bg-purple-50/50 border border-purple-100 space-y-3">
                  <span className="text-xs font-bold text-purple-900 block">Cấu hình Bảo hiểm nhân thọ</span>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    <div>
                      <label className="text-[10px] text-slate-500 font-bold block mb-1">Số tiền mỗi kỳ đóng (VNĐ)</label>
                      <input 
                        type="text" 
                        value={formatInputNumber(state.insuranceConfig?.quarterlyAmount)}
                        onChange={(e) => setState(prev => ({ ...prev, insuranceConfig: { ...prev.insuranceConfig, quarterlyAmount: parseNum(e.target.value) } }))}
                        className="w-full px-3 py-1.5 rounded-lg border border-slate-200 bg-white font-bold"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-500 font-bold block mb-1">Nguồn trích đóng bảo hiểm</label>
                      <select 
                        value={state.insuranceConfig?.source || 'baby_savings'}
                        onChange={(e) => setState(prev => ({ ...prev, insuranceConfig: { ...prev.insuranceConfig, source: e.target.value } }))}
                        className="w-full px-3 py-1.5 rounded-lg border border-slate-200 bg-white font-bold"
                      >
                        <option value="baby_savings">Quỹ Tiết Kiệm Của Bé</option>
                        <option value="monthly_income">Thu Nhập Hàng Tháng</option>
                      </select>
                    </div>
                  </div>
                </div>

                {/* Sao lưu */}
                <div className="pt-2 border-t border-slate-100 flex gap-3">
                  <button 
                    onClick={() => {
                      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
                      const a = document.createElement('a');
                      a.href = URL.createObjectURL(blob);
                      a.download = `SaoLuu_ThuChi_${selectedMonth}.json`;
                      a.click();
                    }}
                    className="flex-1 py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl shadow-xs"
                  >
                    📁 Xuất File Sao Lưu (.json)
                  </button>
                  <label className="flex-1 py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-xs text-center cursor-pointer">
                    📥 Nạp Lại File Cũ
                    <input type="file" accept=".json" onChange={(e) => {
                      const f = e.target.files[0];
                      if (!f) return;
                      const r = new FileReader();
                      r.onload = (ev) => {
                        try {
                          const p = JSON.parse(ev.target.result);
                          if (p.transactions) {
                            setState(prev => ({ ...prev, transactions: p.transactions }));
                            alert('Khôi phục dữ liệu thành công!');
                          }
                        } catch (err) { alert('File lỗi'); }
                      };
                      r.readAsText(f);
                    }} className="hidden" />
                  </label>
                </div>
              </div>
            )}

          </main>

          {/* BOTTOM BAR DI ĐỘNG */}
          <nav className="sm:hidden fixed bottom-0 left-0 right-0 h-16 bg-white/95 backdrop-blur-md border-t border-slate-200 px-6 flex items-center justify-between z-40 shadow-lg">
            <button 
              onClick={() => setActiveTab('overview')}
              className={`flex flex-col items-center gap-1 ${activeTab === 'overview' ? 'text-emerald-600 font-extrabold' : 'text-slate-400'}`}
            >
              <span className="text-lg">📊</span>
              <span className="text-[10px]">Dòng Tiền</span>
            </button>

            <button 
              onClick={() => setShowModal(true)}
              className="w-13 h-13 -mt-6 rounded-full bg-emerald-600 text-white flex items-center justify-center shadow-lg shadow-emerald-500/40 border-4 border-white active:scale-95 font-black text-2xl"
            >
              +
            </button>

            <button 
              onClick={() => setActiveTab('transactions')}
              className={`flex flex-col items-center gap-1 ${activeTab === 'transactions' ? 'text-emerald-600 font-extrabold' : 'text-slate-400'}`}
            >
              <span className="text-lg">📝</span>
              <span className="text-[10px]">Lịch sử</span>
            </button>

            <button 
              onClick={() => setActiveTab('settings')}
              className={`flex flex-col items-center gap-1 ${activeTab === 'settings' ? 'text-emerald-600 font-extrabold' : 'text-slate-400'}`}
            >
              <span className="text-lg">⚙️</span>
              <span className="text-[10px]">Cài đặt</span>
            </button>
          </nav>

          {/* MODAL THÊM KHOẢN CHI */}
          {showModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-1 border-b border-slate-100">
                  <h3 className="font-extrabold text-slate-900 text-base">Ghi Giao Dịch Mới</h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600 p-1">✕</button>
                </div>

                <form onSubmit={handleAddTx} className="space-y-3">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Nội dung</label>
                    <input 
                      type="text"
                      placeholder="VD: Mua rau, sữa chua, đóng bảo hiểm..."
                      value={txTitle}
                      onChange={(e) => setTxTitle(e.target.value)}
                      required
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold outline-none focus:ring-2 focus:ring-emerald-500/30"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Số tiền (VNĐ)</label>
                    <input 
                      type="text"
                      placeholder="VD: 50.000"
                      value={formatInputNumber(txAmount)}
                      onChange={(e) => setTxAmount(e.target.value)}
                      required
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-base font-black text-slate-900 outline-none focus:ring-2 focus:ring-emerald-500/30"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-indigo-900 uppercase mb-1">Nguồn Tiền Trích Ra</label>
                    <select 
                      value={txSource}
                      onChange={(e) => setTxSource(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl border border-indigo-200 text-xs font-bold bg-indigo-50/60 text-indigo-950 outline-none"
                    >
                      <option value="monthly_income">💵 Từ Thu Nhập Tháng (Gói 11M & Học phí thường)</option>
                      <option value="baby_savings">👶 Rút từ Tiết Kiệm Của Bé (Bảo hiểm & CSVC đầu năm)</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Nhóm chi</label>
                      <select 
                        value={txCat}
                        onChange={(e) => setTxCat(e.target.value)}
                        className="w-full px-2.5 py-2 rounded-xl border border-slate-200 text-xs font-semibold bg-white"
                      >
                        <option value="Ăn uống & Đi chợ">Ăn uống & Đi chợ</option>
                        <option value="Em bé & Con cái">Em bé & Con cái</option>
                        <option value="Điện nước & Dịch vụ">Điện nước & Dịch vụ</option>
                        <option value="Chi tiêu cá nhân">Chi tiêu cá nhân</option>
                        <option value="Bảo hiểm nhân thọ">Bảo hiểm nhân thọ</option>
                        <option value="Dự phòng phát sinh">Dự phòng phát sinh</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Phương thức</label>
                      <select 
                        value={txMethod}
                        onChange={(e) => setTxMethod(e.target.value)}
                        className="w-full px-2.5 py-2 rounded-xl border border-slate-200 text-xs font-semibold bg-white"
                      >
                        <option value="Chuyển khoản">Chuyển khoản</option>
                        <option value="Tiền mặt">Tiền mặt</option>
                        <option value="Thẻ tín dụng">Thẻ tín dụng</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-2 flex gap-2">
                    <button type="button" onClick={() => setShowModal(false)} className="flex-1 py-2.5 rounded-xl font-bold text-slate-500 bg-slate-100 text-xs">
                      Hủy
                    </button>
                    <button type="submit" className="flex-1 py-2.5 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-700 text-xs shadow-sm shadow-emerald-500/20">
                      Lưu Khoản Chi
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
