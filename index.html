<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Sổ Thu Chi & Phân Bổ Dòng Tiền Gia Đình</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Be Vietnam Pro"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Be Vietnam Pro', -apple-system, sans-serif;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const STORAGE_KEY = 'GIA_DINH_TAI_CHINH_4PHEU_V2';
    const OLD_KEYS = ['GIA_DINH_TAI_CHINH_4PHEU_V1', 'GIA_DINH_TAI_CHINH_PRO_V4', 'GIA_DINH_CHI_TIEU_BLANK_V2', 'GIA_DINH_CHI_TIEU_BLANK_V1', 'GIA_DINH_THU_CHI_SYNC_V1'];

    const formatVND = (num, hidden = false) => {
      if (hidden) return '•••••• ₫';
      return new Intl.NumberFormat('vi-VN').format(Math.round(num || 0)) + ' ₫';
    };

    const parseNum = (val) => {
      if (typeof val === 'number') return val;
      const clean = String(val || '').replace(/[^0-9]/g, '');
      return parseInt(clean, 10) || 0;
    };

    const formatInputNumber = (val) => {
      const n = parseNum(val);
      return n === 0 ? '' : new Intl.NumberFormat('vi-VN').format(n);
    };

    const DEFAULT_LIVING_BREAKDOWN = {
      'Ăn uống & Đi chợ': 4500000,
      'Em bé & Con cái': 2500000,
      'Điện nước & Dịch vụ': 2000000,
      'Chi tiêu cá nhân': 1000000,
      'Dự phòng phát sinh': 1000000
    };

    const DEFAULT_DATA = {
      // 1. Sổ tiết kiệm nền tảng (320 triệu - Khóa cứng bảo vệ)
      protectedSavings: 320000000,
      // 2. Quỹ tiết kiệm riêng của bé (Dùng để trích đóng bảo hiểm & phí đầu năm)
      babySavingsFund: 20000000, 
      // 3. Dự kiến thu nhập hàng tháng
      incomeExpected: {
        mySalary: 12500000,
        husbandTransfer: 10000000,
        roomRent: 2500000
      },
      // 4. Phễu 1: Ngân sách sinh hoạt chung
      livingBudget: 11000000,
      livingBreakdown: DEFAULT_LIVING_BREAKDOWN,
      // 5. Phễu 2: Học phí Edison Reggio hàng tháng
      edisonMonthly: {
        tuition: 3150000,
        mealFeeDays: 26,
        mealFeePerDay: 50000,
        materials: 100000,
        ac: 100000,
        oneTimeFees: 1520000, // CSVC & Sự kiện đầu năm (Rút từ tiết kiệm bé)
        isMonthlyPaid: false,
        isOneTimePaid: false
      },
      // 6. Tiêm chủng
      vaccineFund: {
        spent: 0
      },
      // 7. Bảo hiểm nhân thọ (Đóng theo quý, kỳ đầu T11 - Rút từ tiết kiệm bé)
      insurance: {
        quarterlyAmount: 0,
        dueMonth: '2026-11',
        isPaid: false
      },
      transactions: []
    };

    function App() {
      const [state, setState] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {}
        }
        for (const k of OLD_KEYS) {
          const raw = localStorage.getItem(k);
          if (raw) {
            try {
              const old = JSON.parse(raw);
              return {
                ...DEFAULT_DATA,
                transactions: old.transactions || []
              };
            } catch (e) {}
          }
        }
        return DEFAULT_DATA;
      });

      const [selectedMonth, setSelectedMonth] = useState('2026-11');
      const [activeTab, setActiveTab] = useState('overview');
      const [hideAmounts, setHideAmounts] = useState(false);

      // Modal thêm giao dịch
      const [showModal, setShowModal] = useState(false);
      const [txTitle, setTxTitle] = useState('');
      const [txAmount, setTxAmount] = useState('');
      const [txType, setTxType] = useState('expense');
      const [txSource, setTxSource] = useState('monthly_income'); // 'monthly_income' hoặc 'baby_savings'
      const [txBucket, setTxBucket] = useState('living11m');
      const [txCat, setTxCat] = useState('Ăn uống & Đi chợ');
      const [txMethod, setTxMethod] = useState('Chuyển khoản');
      const [txDate, setTxDate] = useState(() => {
        const d = new Date();
        return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
      });

      // Bộ lọc
      const [filterSearch, setFilterSearch] = useState('');
      const [filterSource, setFilterSource] = useState('ALL');

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }, [state]);

      // Giao dịch tháng hiện tại
      const currentMonthTxs = useMemo(() => {
        return state.transactions.filter(t => t.monthKey === selectedMonth);
      }, [state.transactions, selectedMonth]);

      // 1. Tổng thu nhập thực nhận
      const totalIncome = useMemo(() => {
        return currentMonthTxs
          .filter(t => t.type === 'income')
          .reduce((sum, t) => sum + t.amount, 0);
      }, [currentMonthTxs]);

      // 2. Phễu 1: Chi gói sinh hoạt 11 triệu (chỉ trừ từ thu nhập tháng)
      const livingTxs = useMemo(() => {
        return currentMonthTxs.filter(t => t.type === 'expense' && (t.bucket === 'living11m' || !t.bucket));
      }, [currentMonthTxs]);

      const livingSpent = useMemo(() => {
        return livingTxs.reduce((sum, t) => sum + t.amount, 0);
      }, [livingTxs]);

      const livingRemaining = Math.max(0, state.livingBudget - livingSpent);

      // Phân rã 5 nhóm con
      const breakdownStats = useMemo(() => {
        return Object.entries(state.livingBreakdown).map(([name, limit]) => {
          const spent = livingTxs
            .filter(t => t.cat === name || (name.includes('Ăn uống') && t.cat?.includes('Ăn uống')) || (name.includes('Em bé') && t.cat?.includes('Em bé')) || (name.includes('Điện nước') && t.cat?.includes('Điện nước')) || (name.includes('cá nhân') && t.cat?.includes('cá nhân')) || (name.includes('Dự phòng') && t.cat?.includes('Dự phòng')))
            .reduce((sum, t) => sum + t.amount, 0);
          return {
            name,
            limit,
            spent,
            percent: limit > 0 ? Math.min(100, Math.round((spent / limit) * 100)) : 0
          };
        });
      }, [state.livingBreakdown, livingTxs]);

      // 3. Phễu 2: Học phí thường tháng Edison Reggio (4.650.000 ₫)
      const edisonMonthlyStandard = useMemo(() => {
        return (state.edisonMonthly.tuition || 3150000) + 
               ((state.edisonMonthly.mealFeeDays || 26) * (state.edisonMonthly.mealFeePerDay || 50000)) + 
               (state.edisonMonthly.materials || 100000) + 
               (state.edisonMonthly.ac || 100000);
      }, [state.edisonMonthly]);

      // 4. Các khoản rút từ quỹ tiết kiệm cho bé (Bảo hiểm + CSVC/Sự kiện 1.520.000 ₫)
      const babySavingsUsedThisMonth = useMemo(() => {
        return currentMonthTxs
          .filter(t => t.type === 'expense' && (t.source === 'baby_savings' || t.bucket === 'insurance' || t.bucket === 'edison_onetime'))
          .reduce((sum, t) => sum + t.amount, 0);
      }, [currentMonthTxs]);

      // 5. Chi từ thu nhập tháng
      const monthlyIncomeExpenses = useMemo(() => {
        return currentMonthTxs
          .filter(t => t.type === 'expense' && t.source !== 'baby_savings' && t.bucket !== 'insurance' && t.bucket !== 'edison_onetime')
          .reduce((sum, t) => sum + t.amount, 0);
      }, [currentMonthTxs]);

      // 6. Tiết kiệm mới tích lũy kỳ này từ thu nhập tháng
      const estimatedNewSavings = useMemo(() => {
        const expectedTotal = totalIncome > 0 ? totalIncome : (state.incomeExpected.mySalary + state.incomeExpected.husbandTransfer + state.incomeExpected.roomRent);
        const plannedExpensesFromMonthly = state.livingBudget + edisonMonthlyStandard;
        return Math.max(0, expectedTotal - (monthlyIncomeExpenses > 0 ? monthlyIncomeExpenses : plannedExpensesFromMonthly));
      }, [totalIncome, state.incomeExpected, state.livingBudget, edisonMonthlyStandard, monthlyIncomeExpenses]);

      // Thẻ tín dụng đã quẹt
      const creditSpent = useMemo(() => {
        return currentMonthTxs
          .filter(t => t.method === 'Thẻ tín dụng' && t.type === 'expense')
          .reduce((sum, t) => sum + t.amount, 0);
      }, [currentMonthTxs]);

      // Thao tác nhanh: Ghi đóng học phí thường tháng Edison (4.650.000 ₫ - Từ Thu Nhập Tháng)
      const handleQuickPayMonthlyEdison = () => {
        if (confirm(`Ghi nhận đóng học phí thường tháng Edison Reggio: ${formatVND(edisonMonthlyStandard)} (tính từ thu nhập tháng)?`)) {
          const newTx = {
            id: Date.now(),
            title: `Tiền học thường tháng Edison Reggio (${selectedMonth})`,
            amount: edisonMonthlyStandard,
            type: 'expense',
            source: 'monthly_income',
            bucket: 'edison_monthly',
            cat: 'Em bé & Con cái',
            method: 'Chuyển khoản',
            monthKey: selectedMonth,
            createdAt: txDate
          };
          setState(prev => ({ ...prev, transactions: [newTx, ...prev.transactions] }));
        }
      };

      // Thao tác nhanh: Rút từ tiết kiệm bé đóng CSVC & Sự kiện (1.520.000 ₫)
      const handleQuickPayOneTimeEdison = () => {
        const amt = state.edisonMonthly.oneTimeFees || 1520000;
        if (confirm(`Ghi nhận rút từ Quỹ Tiết Kiệm Của Bé để đóng CSVC & Sự kiện đầu năm Edison Reggio: ${formatVND(amt)}?`)) {
          const newTx = {
            id: Date.now(),
            title: `Phí CSVC & Sự kiện đầu năm Edison Reggio (Rút tiết kiệm bé)`,
            amount: amt,
            type: 'expense',
            source: 'baby_savings',
            bucket: 'edison_onetime',
            cat: 'Em bé & Con cái',
            method: 'Chuyển khoản',
            monthKey: selectedMonth,
            createdAt: txDate
          };
          setState(prev => ({ ...prev, transactions: [newTx, ...prev.transactions] }));
        }
      };

      // Thao tác nhanh: Rút từ tiết kiệm bé đóng Bảo hiểm nhân thọ
      const handleQuickPayInsurance = () => {
        if (!state.insurance.quarterlyAmount) {
          const inputAmt = prompt('Nhập số tiền bảo hiểm nhân thọ quý này cần đóng (VNĐ):', '6000000');
          if (!inputAmt) return;
          const parsed = parseNum(inputAmt);
          setState(prev => ({ ...prev, insurance: { ...prev.insurance, quarterlyAmount: parsed } }));
          recordInsuranceTx(parsed);
        } else {
          recordInsuranceTx(state.insurance.quarterlyAmount);
        }
      };

      const recordInsuranceTx = (amt) => {
        if (confirm(`Xác nhận rút từ Quỹ Tiết Kiệm Của Bé để đóng Bảo hiểm nhân thọ quý: ${formatVND(amt)}?`)) {
          const newTx = {
            id: Date.now(),
            title: `Đóng phí bảo hiểm nhân thọ (Rút tiết kiệm bé)`,
            amount: amt,
            type: 'expense',
            source: 'baby_savings',
            bucket: 'insurance',
            cat: 'Bảo hiểm nhân thọ',
            method: 'Chuyển khoản',
            monthKey: selectedMonth,
            createdAt: txDate
          };
          setState(prev => ({ ...prev, transactions: [newTx, ...prev.transactions] }));
        }
      };

      // Thêm giao dịch tự do
      const handleAddTx = (e) => {
        e.preventDefault();
        const amt = parseNum(txAmount);
        if (amt <= 0 || !txTitle.trim()) return;

        const newTx = {
          id: Date.now(),
          title: txTitle.trim(),
          amount: amt,
          type: txType,
          source: txType === 'expense' ? txSource : 'income',
          bucket: txBucket,
          cat: txCat,
          method: txMethod,
          monthKey: selectedMonth,
          createdAt: txDate
        };

        setState(prev => ({
          ...prev,
          transactions: [newTx, ...prev.transactions]
        }));

        setTxTitle('');
        setTxAmount('');
        setShowModal(false);
      };

      const handleDelete = (id) => {
        if (confirm('Xóa khoản này khỏi sổ?')) {
          setState(prev => ({
            ...prev,
            transactions: prev.transactions.filter(t => t.id !== id)
          }));
        }
      };

      // Danh sách sau lọc
      const filteredList = useMemo(() => {
        return currentMonthTxs.filter(t => {
          const matchText = !filterSearch || t.title.toLowerCase().includes(filterSearch.toLowerCase());
          const matchSource = filterSource === 'ALL' 
            ? true 
            : filterSource === 'baby_savings' ? (t.source === 'baby_savings' || t.bucket === 'insurance' || t.bucket === 'edison_onetime') : (t.source !== 'baby_savings' && t.bucket !== 'insurance' && t.bucket !== 'edison_onetime');
          return matchText && matchSource;
        });
      }, [currentMonthTxs, filterSearch, filterSource]);

      const monthLabel = `Tháng ${selectedMonth.split('-')[1]}/${selectedMonth.split('-')[0]}`;

      return (
        <div className="flex flex-col min-h-screen bg-[#f8fafc] text-slate-800 pb-20 md:pb-6">
          
          {/* TOP BAR */}
          <header className="bg-white border-b border-slate-200/80 sticky top-0 z-30 px-4 sm:px-8 py-3.5 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-emerald-600 text-white flex items-center justify-center font-black text-lg shadow-sm shadow-emerald-500/20">
                💎
              </div>
              <div>
                <h1 className="font-extrabold text-slate-900 text-sm sm:text-base leading-tight">Phân Bổ Dòng Tiền & Quỹ Cho Bé</h1>
                <div className="flex items-center gap-1.5 mt-0.5">
                  <span className="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200/50">
                    {monthLabel}
                  </span>
                  <button onClick={() => setHideAmounts(!hideAmounts)} className="text-xs text-slate-400 hover:text-slate-600 p-0.5">
                    {hideAmounts ? '👁️' : '🙈'}
                  </button>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <input 
                type="month"
                value={selectedMonth}
                onChange={(e) => setSelectedMonth(e.target.value)}
                className="bg-slate-50 border border-slate-200 text-xs font-bold text-slate-700 rounded-xl px-2.5 py-1.5 outline-none"
              />
              <button 
                onClick={() => setShowModal(true)}
                className="hidden sm:flex items-center gap-1.5 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all shadow-emerald-500/20"
              >
                <span>+ Ghi Khoản Chi</span>
              </button>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-5">
            
            {/* THANH ĐIỀU HƯỚNG TẦNG TRÊN (MÁY TÍNH) */}
            <div className="hidden sm:flex bg-white p-1 rounded-2xl border border-slate-200/80 shadow-xs max-w-lg mx-auto text-xs font-bold">
              <button 
                onClick={() => setActiveTab('overview')}
                className={`flex-1 py-2 rounded-xl transition-all ${activeTab === 'overview' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800'}`}
              >
                📊 Dòng Tiền & 2 Nguồn Chi
              </button>
              <button 
                onClick={() => setActiveTab('transactions')}
                className={`flex-1 py-2 rounded-xl transition-all ${activeTab === 'transactions' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800'}`}
              >
                📝 Lịch Sử Chi Tiêu ({monthTransactions.length})
              </button>
              <button 
                onClick={() => setActiveTab('settings')}
                className={`flex-1 py-2 rounded-xl transition-all ${activeTab === 'settings' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800'}`}
              >
                ⚙️ Định Mức & Quỹ Cho Bé
              </button>
            </div>

            {/* TAB 1: OVERVIEW */}
            {activeTab === 'overview' && (
              <div className="space-y-4">
                
                {/* KHỐI 1: SỔ TIẾT KIỆM NỀN TẢNG BẢO VỆ 320 TRIỆU */}
                <div className="bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 rounded-3xl p-5 text-white shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div className="space-y-1">
                    <div className="flex items-center gap-2">
                      <span className="text-[11px] font-extrabold uppercase tracking-wider bg-white/20 px-2.5 py-0.5 rounded-full">
                        🛡️ Tiết Kiệm Nền Tảng (Khóa An Toàn)
                      </span>
                      <span className="text-[10px] bg-emerald-400 text-emerald-950 font-black px-2 py-0.5 rounded-full">Giữ nguyên</span>
                    </div>
                    <div className="text-2xl sm:text-3xl font-black tracking-tight">
                      {formatVND(state.protectedSavings, hideAmounts)}
                    </div>
                    <p className="text-[11px] text-emerald-100">
                      Tuyệt đối không đụng vào kể cả đóng bảo hiểm hay học phí đầu năm.
                    </p>
                  </div>

                  <div className="bg-white/10 backdrop-blur-xs p-3 rounded-2xl border border-white/20 text-right">
                    <span className="text-[11px] text-emerald-100 font-semibold block">Tích lũy mới thêm tháng này:</span>
                    <span className="text-xl font-black text-white">+{formatVND(estimatedNewSavings, hideAmounts)}</span>
                  </div>
                </div>

                {/* KHỐI 2: NGUỒN TIẾT KIỆM CỦA BÉ ĐỂ TRÍCH ĐÓNG PHÁT SINH */}
                <div className="bg-gradient-to-br from-indigo-50 to-purple-50/70 rounded-3xl p-5 border border-purple-200/80 shadow-xs space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <span className="text-[11px] font-extrabold uppercase tracking-wider text-purple-800 bg-purple-100 px-2.5 py-0.5 rounded-full">
                        👶 Nguồn: Quỹ Tiết Kiệm Dành Riêng Cho Bé
                      </span>
                      <h3 className="text-lg font-black text-slate-900 mt-1">
                        Dành riêng đóng: Bảo Hiểm & CSVC Đầu Năm
                      </h3>
                    </div>
                    <div className="text-right">
                      <span className="text-xs text-slate-400 font-bold block">Đã trích tháng này</span>
                      <span className="text-base font-black text-purple-700">-{formatVND(babySavingsUsedThisMonth, hideAmounts)}</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                    {/* Mục 1: CSVC & Sự kiện đầu năm Edison Reggio (1.520.000 ₫) */}
                    <div className="p-3.5 rounded-2xl bg-white border border-purple-100 shadow-2xs space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-bold text-slate-800">1. CSVC & Sự kiện Edison</span>
                        <span className="font-black text-slate-900">1.520.000 ₫</span>
                      </div>
                      <p className="text-[10px] text-slate-400">Khoản phát sinh đầu năm học, trích từ tiết kiệm bé.</p>
                      
                      {currentMonthTxs.some(t => t.bucket === 'edison_onetime') ? (
                        <span className="block text-center text-xs font-bold text-emerald-700 bg-emerald-50 py-1 rounded-xl">
                          ✓ Đã trích đóng từ quỹ bé
                        </span>
                      ) : (
                        <button 
                          onClick={handleQuickPayOneTimeEdison}
                          className="w-full py-1.5 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-xs"
                        >
                          Trích Quỹ Bé Đóng (1.52M)
                        </button>
                      )}
                    </div>

                    {/* Mục 2: Bảo hiểm nhân thọ (Đóng theo quý 3 tháng/lần) */}
                    <div className="p-3.5 rounded-2xl bg-white border border-purple-100 shadow-2xs space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-bold text-slate-800">2. Bảo hiểm nhân thọ (Kỳ T11)</span>
                        <span className="font-black text-purple-900">
                          {state.insurance.quarterlyAmount > 0 ? formatVND(state.insurance.quarterlyAmount, hideAmounts) : 'Chưa nhập'}
                        </span>
                      </div>
                      <p className="text-[10px] text-slate-400">Đóng 3 tháng/lần, trích từ tiết kiệm bé.</p>
                      
                      {currentMonthTxs.some(t => t.bucket === 'insurance') ? (
                        <span className="block text-center text-xs font-bold text-emerald-700 bg-emerald-50 py-1 rounded-xl">
                          ✓ Đã trích đóng bảo hiểm
                        </span>
                      ) : (
                        <button 
                          onClick={handleQuickPayInsurance}
                          className="w-full py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-xs"
                        >
                          Trích Quỹ Bé Đóng Bảo Hiểm
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                {/* KHỐI 3: DÒNG TIỀN TỪ THU NHẬP HÀNG THÁNG (~25 TRIỆU) */}
                <div className="space-y-4">
                  {/* Phễu 1: Quỹ chi tiêu chung 11M */}
                  <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-xs space-y-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <span className="text-[11px] font-extrabold uppercase tracking-wider text-amber-800 bg-amber-100 px-2.5 py-0.5 rounded-full">
                          Nguồn Thu Nhập Tháng: Quỹ Chi Tiêu Chung (11M)
                        </span>
                        <h2 className="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight mt-1.5">
                          Còn lại: <span className="text-emerald-600">{formatVND(livingRemaining, hideAmounts)}</span>
                        </h2>
                      </div>
                      <div className="text-right">
                        <span className="text-xs font-bold text-slate-400 block">Đã xuất</span>
                        <span className="text-lg font-black text-slate-800">{formatVND(livingSpent, hideAmounts)}</span>
                      </div>
                    </div>

                    {/* Thanh tiến độ chính 11M */}
                    <div className="space-y-1.5">
                      <div className="w-full bg-slate-100 h-3.5 rounded-full overflow-hidden p-0.5">
                        <div 
                          className={`h-full rounded-full transition-all duration-500 ${livingSpent > state.livingBudget ? 'bg-rose-500' : 'bg-emerald-500'}`}
                          style={{ width: `${Math.min(100, Math.round((livingSpent / state.livingBudget) * 100))}%` }}
                        />
                      </div>
                      <div className="flex justify-between items-center text-[11px] font-bold text-slate-500">
                        <span>Đã tiêu: {Math.round((livingSpent / state.livingBudget) * 100)}%</span>
                        <span>Định mức: {formatVND(state.livingBudget, hideAmounts)}</span>
                      </div>
                    </div>

                    {/* Phân rã 5 nhóm con */}
                    <div className="pt-2 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      {breakdownStats.map(item => (
                        <div key={item.name} className="p-2.5 rounded-xl bg-slate-50/80 border border-slate-100 space-y-1">
                          <div className="flex justify-between items-center text-xs font-bold">
                            <span className="text-slate-800">{item.name}</span>
                            <span className={item.spent > item.limit ? 'text-rose-600 font-extrabold' : 'text-slate-700'}>
                              {formatVND(item.spent, hideAmounts)} <span className="text-slate-400 font-normal">/ {formatVND(item.limit, hideAmounts)}</span>
                            </span>
                          </div>
                          <div className="w-full bg-slate-200/80 h-1.5 rounded-full overflow-hidden">
                            <div 
                              className={`h-full rounded-full transition-all ${item.percent >= 100 ? 'bg-rose-500' : item.percent >= 80 ? 'bg-amber-500' : 'bg-emerald-500'}`}
                              style={{ width: `${item.percent}%` }}
                            />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Phễu 2: Học phí thường tháng Edison Reggio (4.650.000 ₫ - Từ Thu Nhập Tháng) */}
                  <div className="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-xs space-y-3">
                    <div className="flex items-center justify-between">
                      <div>
                        <span className="text-[11px] font-extrabold uppercase tracking-wider text-blue-800 bg-blue-100 px-2.5 py-0.5 rounded-full">
                          Nguồn Thu Nhập Tháng: Tiền Học Thường Tháng Của Bé
                        </span>
                        <h3 className="text-base font-black text-slate-900 mt-1">
                          Mầm Non Edison Reggio (Thường Tháng)
                        </h3>
                      </div>
                      <span className="text-lg font-black text-blue-700">{formatVND(edisonMonthlyStandard, hideAmounts)}</span>
                    </div>

                    <div className="p-3 bg-blue-50/50 rounded-2xl border border-blue-100 flex items-center justify-between text-xs">
                      <div className="space-y-0.5">
                        <span className="text-slate-600 font-semibold block">Gồm: Học phí 3.15M + Ăn 26 ngày (1.3M) + Học liệu & Điều hòa (200k)</span>
                        <span className="text-[10px] text-slate-400">Trích trực tiếp từ thu nhập lương/chồng chuyển hằng tháng.</span>
                      </div>

                      {currentMonthTxs.some(t => t.bucket === 'edison_monthly') ? (
                        <span className="text-xs bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-xl">
                          ✓ Đã đóng tiền tháng
                        </span>
                      ) : (
                        <button 
                          onClick={handleQuickPayMonthlyEdison}
                          className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-xs"
                        >
                          Ghi Nhận Đã Đóng
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                {/* THẺ TÍN DỤNG */}
                <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <span className="text-xl">💳</span>
                    <div>
                      <span className="text-xs font-bold text-slate-800 block">Đã quẹt thẻ tín dụng tháng này</span>
                      <span className="text-[10px] text-slate-400">Thanh toán sao kê vào ngày 20</span>
                    </div>
                  </div>
                  <span className="text-base font-black text-rose-600">{formatVND(creditSpent, hideAmounts)}</span>
                </div>

              </div>
            )}

            {/* TAB 2: LỊCH SỬ GIAO DỊCH */}
            {activeTab === 'transactions' && (
              <div className="bg-white rounded-3xl border border-slate-200/80 shadow-xs overflow-hidden space-y-3">
                <div className="p-4 border-b border-slate-100 space-y-3">
                  <div className="flex flex-col sm:flex-row gap-2 justify-between">
                    <input 
                      type="text" 
                      placeholder="🔍 Tìm tên món (chợ, thịt, bảo hiểm, học phí...)..."
                      value={filterSearch}
                      onChange={(e) => setFilterSearch(e.target.value)}
                      className="px-3.5 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
                    />

                    <select 
                      value={filterSource} 
                      onChange={(e) => setFilterSource(e.target.value)}
                      className="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold text-slate-700"
                    >
                      <option value="ALL">Tất cả nguồn chi</option>
                      <option value="monthly_income">Chi từ thu nhập tháng (11M & Học phí)</option>
                      <option value="baby_savings">Rút từ tiết kiệm bé (Bảo hiểm & CSVC)</option>
                    </select>
                  </div>
                </div>

                {filteredList.length === 0 ? (
                  <div className="p-10 text-center text-slate-400 text-xs">Chưa có giao dịch nào phù hợp trong {monthLabel}.</div>
                ) : (
                  <div className="divide-y divide-slate-100 max-h-[600px] overflow-y-auto custom-scroll">
                    {filteredList.map(tx => (
                      <div key={tx.id} className="p-3.5 sm:px-5 flex items-center justify-between hover:bg-slate-50 transition-colors">
                        <div className="flex items-center gap-3 min-w-0">
                          <div className="w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center font-bold text-sm flex-shrink-0">
                            {tx.source === 'baby_savings' ? '👶' : (tx.method === 'Thẻ tín dụng' ? '💳' : (tx.method === 'Chuyển khoản' ? '🏦' : '💵'))}
                          </div>
                          <div className="min-w-0">
                            <p className="font-bold text-slate-900 text-sm truncate">{tx.title}</p>
                            <div className="flex items-center gap-1.5 text-xs text-slate-400 mt-0.5 flex-wrap">
                              <span className="font-semibold text-slate-600">{tx.cat}</span>
                              <span>•</span>
                              <span className="text-[10px] bg-slate-100 px-1.5 py-0.2 rounded font-bold">{tx.method}</span>
                              {tx.source === 'baby_savings' ? (
                                <span className="text-[9px] bg-purple-100 text-purple-800 font-bold px-1.5 py-0.2 rounded">Rút từ tiết kiệm bé</span>
                              ) : (
                                <span className="text-[9px] bg-emerald-50 text-emerald-700 font-bold px-1.5 py-0.2 rounded">Thu nhập tháng</span>
                              )}
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center gap-3 flex-shrink-0">
                          <span className={`font-black text-sm sm:text-base ${tx.source === 'baby_savings' ? 'text-purple-700' : 'text-rose-600'}`}>
                            -{formatVND(tx.amount, hideAmounts)}
                          </span>
                          <button onClick={() => handleDelete(tx.id)} className="text-slate-300 hover:text-rose-500 p-1 text-xs">✕</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: SETTINGS */}
            {activeTab === 'settings' && (
              <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-xs space-y-5">
                <div>
                  <h3 className="font-bold text-slate-900 text-base">Cấu Hình Định Mức Các Nguồn Tiền</h3>
                  <p className="text-xs text-slate-500">Tùy chỉnh số tiền các quỹ và hạn mức sinh hoạt.</p>
                </div>

                <div className="space-y-3">
                  <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100 space-y-1.5">
                    <span className="text-xs font-bold text-slate-800 block">1. Tiết kiệm nền tảng bảo vệ</span>
                    <input 
                      type="text"
                      value={formatInputNumber(state.protectedSavings)}
                      onChange={(e) => setState(prev => ({ ...prev, protectedSavings: parseNum(e.target.value) }))}
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 font-bold text-xs"
                    />
                  </div>

                  <div className="p-3.5 rounded-2xl bg-purple-50/50 border border-purple-100 space-y-1.5">
                    <span className="text-xs font-bold text-purple-900 block">2. Quỹ tiết kiệm dành riêng cho bé (Để trích đóng bảo hiểm/CSVC)</span>
                    <input 
                      type="text"
                      value={formatInputNumber(state.babySavingsFund)}
                      onChange={(e) => setState(prev => ({ ...prev, babySavingsFund: parseNum(e.target.value) }))}
                      className="w-full px-3 py-2 rounded-xl border border-purple-200 font-bold text-xs"
                    />
                  </div>

                  <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100 space-y-1.5">
                    <span className="text-xs font-bold text-slate-800 block">3. Ngân sách sinh hoạt chung 11M</span>
                    <input 
                      type="text"
                      value={formatInputNumber(state.livingBudget)}
                      onChange={(e) => setState(prev => ({ ...prev, livingBudget: parseNum(e.target.value) }))}
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 font-bold text-xs"
                    />
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-100 flex gap-3">
                  <button 
                    onClick={() => {
                      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
                      const a = document.createElement('a');
                      a.href = URL.createObjectURL(blob);
                      a.download = `SaoLuu_ThuChi_${selectedMonth}.json`;
                      a.click();
                    }}
                    className="flex-1 py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl shadow-xs"
                  >
                    📁 Xuất File Sao Lưu (.json)
                  </button>
                  <label className="flex-1 py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-xs text-center cursor-pointer">
                    📥 Nạp Lại File Cũ
                    <input type="file" accept=".json" onChange={(e) => {
                      const f = e.target.files[0];
                      if (!f) return;
                      const r = new FileReader();
                      r.onload = (ev) => {
                        try {
                          const p = JSON.parse(ev.target.result);
                          if (p.transactions) {
                            setState(prev => ({ ...prev, transactions: p.transactions }));
                            alert('Khôi phục dữ liệu thành công!');
                          }
                        } catch (err) { alert('File lỗi'); }
                      };
                      r.readAsText(f);
                    }} className="hidden" />
                  </label>
                </div>
              </div>
            )}

          </main>

          {/* BOTTOM BAR DI ĐỘNG */}
          <nav className="sm:hidden fixed bottom-0 left-0 right-0 h-16 bg-white/95 backdrop-blur-md border-t border-slate-200 px-6 flex items-center justify-between z-40 shadow-lg">
            <button 
              onClick={() => setActiveTab('overview')}
              className={`flex flex-col items-center gap-1 ${activeTab === 'overview' ? 'text-emerald-600 font-extrabold' : 'text-slate-400'}`}
            >
              <span className="text-lg">📊</span>
              <span className="text-[10px]">Dòng Tiền</span>
            </button>

            <button 
              onClick={() => setShowModal(true)}
              className="w-13 h-13 -mt-6 rounded-full bg-emerald-600 text-white flex items-center justify-center shadow-lg shadow-emerald-500/40 border-4 border-white active:scale-95 font-black text-2xl"
            >
              +
            </button>

            <button 
              onClick={() => setActiveTab('transactions')}
              className={`flex flex-col items-center gap-1 ${activeTab === 'transactions' ? 'text-emerald-600 font-extrabold' : 'text-slate-400'}`}
            >
              <span className="text-lg">📝</span>
              <span className="text-[10px]">Lịch sử</span>
            </button>
          </nav>

          {/* MODAL GHI GIAO DỊCH (CÓ CHỌN NGUỒN TIỀN) */}
          {showModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-1 border-b border-slate-100">
                  <h3 className="font-extrabold text-slate-900 text-base">Ghi Giao Dịch Mới</h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600 p-1">✕</button>
                </div>

                <form onSubmit={handleAddTx} className="space-y-3">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Nội dung</label>
                    <input 
                      type="text"
                      placeholder="VD: Mua rau, sữa chua, đóng bảo hiểm..."
                      value={txTitle}
                      onChange={(e) => setTxTitle(e.target.value)}
                      required
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold outline-none focus:ring-2 focus:ring-emerald-500/30"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Số tiền (VNĐ)</label>
                    <input 
                      type="text"
                      placeholder="VD: 50.000"
                      value={formatInputNumber(txAmount)}
                      onChange={(e) => setTxAmount(e.target.value)}
                      required
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-base font-black text-slate-900 outline-none focus:ring-2 focus:ring-emerald-500/30"
                    />
                  </div>

                  {/* CHỌN NGUỒN TIỀN TRÍCH RA */}
                  <div>
                    <label className="block text-[11px] font-bold text-indigo-900 uppercase mb-1">Nguồn Tiền Trích Ra</label>
                    <select 
                      value={txSource}
                      onChange={(e) => setTxSource(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl border border-indigo-200 text-xs font-bold bg-indigo-50/60 text-indigo-950 outline-none"
                    >
                      <option value="monthly_income">💵 Từ Thu Nhập Tháng (Gói 11M & Học phí thường)</option>
                      <option value="baby_savings">👶 Rút từ Tiết Kiệm Của Bé (Bảo hiểm & CSVC đầu năm)</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Nhóm chi</label>
                      <select 
                        value={txCat}
                        onChange={(e) => setTxCat(e.target.value)}
                        className="w-full px-2.5 py-2 rounded-xl border border-slate-200 text-xs font-semibold bg-white"
                      >
                        <option value="Ăn uống & Đi chợ">Ăn uống & Đi chợ</option>
                        <option value="Em bé & Con cái">Em bé & Con cái</option>
                        <option value="Điện nước & Dịch vụ">Điện nước & Dịch vụ</option>
                        <option value="Chi tiêu cá nhân">Chi tiêu cá nhân</option>
                        <option value="Bảo hiểm nhân thọ">Bảo hiểm nhân thọ</option>
                        <option value="Dự phòng phát sinh">Dự phòng phát sinh</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Phương thức</label>
                      <select 
                        value={txMethod}
                        onChange={(e) => setTxMethod(e.target.value)}
                        className="w-full px-2.5 py-2 rounded-xl border border-slate-200 text-xs font-semibold bg-white"
                      >
                        <option value="Chuyển khoản">Chuyển khoản</option>
                        <option value="Tiền mặt">Tiền mặt</option>
                        <option value="Thẻ tín dụng">Thẻ tín dụng</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-2 flex gap-2">
                    <button type="button" onClick={() => setShowModal(false)} className="flex-1 py-2.5 rounded-xl font-bold text-slate-500 bg-slate-100 text-xs">
                      Hủy
                    </button>
                    <button type="submit" className="flex-1 py-2.5 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-700 text-xs shadow-sm shadow-emerald-500/20">
                      Lưu Khoản Chi
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
