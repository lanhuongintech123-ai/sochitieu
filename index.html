<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Sổ Quản Lý Tài Chính & Chi Tiêu Gia Đình</title>
  
  <!-- Font chữ chuẩn Plus Jakarta Sans & Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Be Vietnam Pro"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Be Vietnam Pro', -apple-system, sans-serif;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const STORAGE_KEY = 'GIA_DINH_TAI_CHINH_PRO_V4';
    const OLD_STORAGE_KEYS = ['GIA_DINH_CHI_TIEU_BLANK_V2', 'GIA_DINH_CHI_TIEU_BLANK_V1', 'GIA_DINH_THU_CHI_SYNC_V1'];

    // Tiện ích format
    const formatVND = (num, hidden = false) => {
      if (hidden) return '•••••• ₫';
      return new Intl.NumberFormat('vi-VN').format(Math.round(num || 0)) + ' ₫';
    };

    const parseNumber = (val) => {
      if (typeof val === 'number') return val;
      const clean = String(val || '').replace(/[^0-9]/g, '');
      return parseInt(clean, 10) || 0;
    };

    const formatInputNumber = (val) => {
      const n = parseNumber(val);
      return n === 0 ? '' : new Intl.NumberFormat('vi-VN').format(n);
    };

    const getCurrentMonthKey = () => {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      return `${d.getFullYear()}-${m}`;
    };

    const getTodayDateStr = () => {
      const d = new Date();
      const day = String(d.getDate()).padStart(2, '0');
      const m = String(d.getMonth() + 1).padStart(2, '0');
      return `${day}/${m}/${d.getFullYear()}`;
    };

    // CẤU TRÚC DỮ LIỆU BAN ĐẦU CHUẨN
    const INITIAL_SETUP_DATA = {
      version: 4,
      lastBackupDate: null,
      hideAmounts: false,
      // 1. TÀI KHOẢN
      accounts: [
        { id: 'acc_cash', name: 'Tiền mặt', type: 'cash', initialBalance: 0, protected: false },
        { id: 'acc_bank', name: 'Tài khoản ngân hàng', type: 'bank', initialBalance: 0, protected: false },
        { id: 'acc_saving_base', name: 'Sổ tiết kiệm nền tảng', type: 'saving', initialBalance: 0, protected: true, targetProtection: 320000000 },
        { id: 'acc_saving_flex', name: 'Tiết kiệm tích lũy mới', type: 'saving', initialBalance: 0, protected: false },
        { id: 'acc_credit', name: 'Thẻ tín dụng', type: 'credit', initialBalance: 0, currentStatementDebt: 0, statementDueDate: '20' }
      ],
      // 2. DANH MỤC THU & CHI
      categories: {
        income: [
          { id: 'inc_salary', name: 'Lương tôi', type: 'regular' },
          { id: 'inc_husband', name: 'Chồng chuyển', type: 'regular' },
          { id: 'inc_rent', name: 'Cho thuê phòng', type: 'regular' },
          { id: 'inc_cashback', name: 'Cashback thực nhận', type: 'irregular' },
          { id: 'inc_bonus', name: 'Thưởng', type: 'irregular' },
          { id: 'inc_baby_gift', name: 'Tiền tặng bé', type: 'irregular' },
          { id: 'inc_gift', name: 'Tiền mừng/quà tặng', type: 'irregular' },
          { id: 'inc_tax_refund', name: 'Hoàn thuế thực nhận', type: 'irregular' },
          { id: 'inc_other', name: 'Thu khác', type: 'irregular' }
        ],
        expense: [
          { id: 'exp_living', name: 'Sinh hoạt gia đình (Ăn uống, Chợ, Điện nước)', isLivingBudget11m: true, color: '#f97316' },
          { id: 'exp_baby', name: 'Em bé Xoài (Sữa, bỉm, đồ dùng)', isLivingBudget11m: true, color: '#ec4899' },
          { id: 'exp_school', name: 'Bé đi học Green (Học phí, Tiền ăn, CSVC...)', isLivingBudget11m: false, color: '#3b82f6' },
          { id: 'exp_health', name: 'Sức khỏe & Tiêm phòng', isLivingBudget11m: false, color: '#10b981' },
          { id: 'exp_social', name: 'Hiếu hỉ, thăm hỏi & Biếu tặng', isLivingBudget11m: false, color: '#8b5cf6' },
          { id: 'exp_big_purchase', name: 'Mua sắm lớn (Máy sấy, Tủ lạnh...)', isLivingBudget11m: false, color: '#6366f1' },
          { id: 'exp_leisure', name: 'Du lịch & Giải trí', isLivingBudget11m: false, color: '#eab308' },
          { id: 'exp_other', name: 'Chi tiêu cá nhân & Khác', isLivingBudget11m: true, color: '#64748b' }
        ]
      },
      // 3. HẠN MỨC NGÂN SÁCH SINH HOẠT
      livingMonthlyBudget: 11000000,
      monthlyBudgets: {},
      // 4. QUỸ ĐỂ DÀNH
      funds: [
        { id: 'fund_living', name: 'Quỹ Sinh hoạt', allocated: 0, target: 11000000, color: '#f97316' },
        { id: 'fund_school', name: 'Quỹ Đi học trường Green', allocated: 0, target: 6000000, color: '#3b82f6' },
        { id: 'fund_health', name: 'Quỹ Tiêm & Sức khỏe', allocated: 0, target: 3000000, color: '#10b981' },
        { id: 'fund_social', name: 'Quỹ Hiếu hỉ', allocated: 0, target: 2000000, color: '#8b5cf6' },
        { id: 'fund_big_purchase', name: 'Quỹ Mua sắm lớn (Máy sấy, tủ lạnh)', allocated: 0, target: 10000000, color: '#6366f1' },
        { id: 'fund_baby_piggy', name: 'Quỹ Tiền riêng của bé Xoài', allocated: 0, target: 0, color: '#ec4899' },
        { id: 'fund_saving_new', name: 'Quỹ Tiết kiệm mới', allocated: 0, target: 0, color: '#059669' }
      ],
      // 5. KẾ HOẠCH DỰ KIẾN (Kế hoạch thu-chi)
      schedules: [
        { id: 'sch_1', name: 'Chồng chuyển tiền quản lý', amount: 10000000, type: 'income', expectedDate: '05', isRecurring: true, status: 'pending', catId: 'inc_husband', fundId: 'fund_living' },
        { id: 'sch_2', name: 'Lương tôi', amount: 12500000, type: 'income', expectedDate: '10', isRecurring: true, status: 'pending', catId: 'inc_salary', fundId: 'fund_living' },
        { id: 'sch_3', name: 'Học phí & Tiền ăn trường Green', amount: 5020000, type: 'expense', expectedDate: '15', isRecurring: true, status: 'pending', catId: 'exp_school', fundId: 'fund_school' },
        { id: 'sch_4', name: 'Thanh toán sao kê thẻ tín dụng', amount: 0, type: 'statement_pay', expectedDate: '20', isRecurring: true, status: 'pending', catId: 'exp_living', fundId: 'fund_living' }
      ],
      // 6. CẤU HÌNH TRƯỜNG MẦM NON GREEN
      greenSchoolConfig: {
        tuitionMonthly: 3700000,
        mealFeePerDay: 60000,
        studySuppliesMonthly: 200000,
        facilityYearly: 2000000,
        kidsOnlineYearly: 300000,
        uniformPackage: 850000,
        trialDayFee: 250000,
        absenceDays: [],
        note: 'T11/2026 nhập học giữa tháng; T12/2026 miễn học phí; Nghỉ liên tiếp >11 ngày giảm 30% học phí khi xác nhận.'
      },
      // 7. GIAO DỊCH THỰC TẾ
      transactions: [],
      // 8. KHOẢN PHÂN BỔ TRẢ TRƯỚC
      prepaidAmortizations: []
    };

    function App() {
      const [state, setState] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {
            console.error('Lỗi đọc dữ liệu mới:', e);
          }
        }
        for (const oldKey of OLD_STORAGE_KEYS) {
          const oldDataRaw = localStorage.getItem(oldKey);
          if (oldDataRaw) {
            try {
              const oldData = JSON.parse(oldDataRaw);
              const migrated = { ...INITIAL_SETUP_DATA };
              if (Array.isArray(oldData.transactions)) {
                migrated.transactions = oldData.transactions.map(t => ({
                  id: t.id || Date.now(),
                  title: t.title,
                  amount: t.amount,
                  type: 'expense',
                  cat: t.cat || 'Sinh hoạt gia đình (Ăn uống, Chợ, Điện nước)',
                  method: t.method || 'Chuyển khoản',
                  accountId: t.method === 'Thẻ tín dụng' ? 'acc_credit' : (t.method === 'Tiền mặt' ? 'acc_cash' : 'acc_bank'),
                  monthKey: t.monthKey || '2026-10',
                  date: t.createdAt || getTodayDateStr(),
                  note: 'Nhập từ phiên bản trước'
                }));
              }
              return migrated;
            } catch (err) {
              console.error('Lỗi chuyển đổi dữ liệu cũ:', err);
            }
          }
        }
        return INITIAL_SETUP_DATA;
      });

      const [selectedMonth, setSelectedMonth] = useState('2026-10');
      const [activeTab, setActiveTab] = useState('overview');
      const [hideAmounts, setHideAmounts] = useState(() => state.hideAmounts || false);

      const [showAddTxModal, setShowAddTxModal] = useState(false);
      const [txType, setTxType] = useState('expense');
      const [txTitle, setTxTitle] = useState('');
      const [txAmount, setTxAmount] = useState('');
      const [txCat, setTxCat] = useState('');
      const [txAccountId, setTxAccountId] = useState('acc_bank');
      const [txTargetAccountId, setTxTargetAccountId] = useState('acc_cash');
      const [txFundId, setTxFundId] = useState('');
      const [txDate, setTxDate] = useState(getTodayDateStr);
      const [txNote, setTxNote] = useState('');

      const [searchQuery, setSearchQuery] = useState('');
      const [filterCat, setFilterCat] = useState('ALL');
      const [filterAcc, setFilterAcc] = useState('ALL');
      const [filterType, setFilterType] = useState('ALL');
      const [filterSort, setFilterSort] = useState('newest');

      const [amortizationView, setAmortizationView] = useState('cashflow');

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, hideAmounts }));
      }, [state, hideAmounts]);

      const accountBalances = useMemo(() => {
        const balances = {};
        state.accounts.forEach(acc => {
          balances[acc.id] = acc.initialBalance || 0;
        });

        state.transactions.forEach(t => {
          const amt = t.amount || 0;
          if (t.type === 'income') {
            if (balances[t.accountId] !== undefined) balances[t.accountId] += amt;
          } else if (t.type === 'expense') {
            if (t.accountId === 'acc_credit') {
              balances['acc_credit'] = (balances['acc_credit'] || 0) + amt;
            } else if (balances[t.accountId] !== undefined) {
              balances[t.accountId] -= amt;
            }
          } else if (t.type === 'transfer') {
            if (balances[t.fromAccountId] !== undefined) balances[t.fromAccountId] -= amt;
            if (balances[t.toAccountId] !== undefined) balances[t.toAccountId] += amt;
          } else if (t.type === 'statement_pay') {
            if (balances[t.fromAccountId] !== undefined) balances[t.fromAccountId] -= amt;
            if (balances['acc_credit'] !== undefined) balances['acc_credit'] = Math.max(0, balances['acc_credit'] - amt);
          } else if (t.type === 'refund') {
            if (balances[t.accountId] !== undefined) balances[t.accountId] += amt;
          }
        });

        return balances;
      }, [state.accounts, state.transactions]);

      const totalLiquidAssets = useMemo(() => (accountBalances['acc_cash'] || 0) + (accountBalances['acc_bank'] || 0), [accountBalances]);
      const protectedSavings = useMemo(() => accountBalances['acc_saving_base'] || 0, [accountBalances]);
      const flexSavings = useMemo(() => accountBalances['acc_saving_flex'] || 0, [accountBalances]);
      const totalCreditDebt = useMemo(() => accountBalances['acc_credit'] || 0, [accountBalances]);

      const spendableCash = useMemo(() => Math.max(0, totalLiquidAssets + flexSavings - totalCreditDebt), [totalLiquidAssets, flexSavings, totalCreditDebt]);

      const currentMonthTxs = useMemo(() => state.transactions.filter(t => t.monthKey === selectedMonth), [state.transactions, selectedMonth]);
      const monthIncome = useMemo(() => currentMonthTxs.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0), [currentMonthTxs]);
      const monthExpense = useMemo(() => currentMonthTxs.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0), [currentMonthTxs]);

      const livingSpent = useMemo(() => currentMonthTxs.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0), [currentMonthTxs]);
      const livingBudgetLimit = state.monthlyBudgets[selectedMonth]?.livingLimit || state.livingMonthlyBudget || 11000000;
      const livingRemaining = Math.max(0, livingBudgetLimit - livingSpent);

      const filteredTransactions = useMemo(() => {
        return currentMonthTxs
          .filter(t => {
            const matchesSearch = !searchQuery.trim() || t.title.toLowerCase().includes(searchQuery.toLowerCase().trim()) || (t.note && t.note.toLowerCase().includes(searchQuery.toLowerCase().trim()));
            const matchesCat = filterCat === 'ALL' || t.cat === filterCat;
            const matchesAcc = filterAcc === 'ALL' || t.accountId === filterAcc || t.fromAccountId === filterAcc || t.toAccountId === filterAcc;
            const matchesType = filterType === 'ALL' || t.type === filterType;
            return matchesSearch && matchesCat && matchesAcc && matchesType;
          })
          .sort((a, b) => {
            if (filterSort === 'newest') return b.id - a.id;
            if (filterSort === 'oldest') return a.id - b.id;
            if (filterSort === 'amount_desc') return b.amount - a.amount;
            if (filterSort === 'amount_asc') return a.amount - b.amount;
            return 0;
          });
      }, [currentMonthTxs, searchQuery, filterCat, filterAcc, filterType, filterSort]);

      const handleSaveTransaction = (e) => {
        e.preventDefault();
        const amt = parseNumber(txAmount);
        if (amt <= 0 || !txTitle.trim()) {
          alert('Vui lòng nhập tên giao dịch và số tiền hợp lệ lớn hơn 0.');
          return;
        }

        if (txType === 'transfer' && txAccountId === 'acc_saving_base') {
          const confirmTake = confirm('⚠️ CẢNH BÁO: Bạn đang chuyển tiền ra khỏi "Sổ tiết kiệm nền tảng được bảo vệ"! Khoản này được đặt để giữ nguyên. Bạn có chắc chắn muốn rút không?');
          if (!confirmTake) return;
        }

        const newTx = {
          id: Date.now(),
          title: txTitle.trim(),
          amount: amt,
          type: txType,
          cat: txType === 'income' ? (txCat || 'Lương tôi') : (txCat || 'Sinh hoạt gia đình (Ăn uống, Chợ, Điện nước)'),
          accountId: txAccountId,
          fromAccountId: txType === 'transfer' || txType === 'statement_pay' ? txAccountId : undefined,
          toAccountId: txType === 'transfer' ? txTargetAccountId : (txType === 'statement_pay' ? 'acc_credit' : undefined),
          fundId: txFundId || undefined,
          monthKey: selectedMonth,
          date: txDate || getTodayDateStr(),
          note: txNote.trim()
        };

        setState(prev => ({ ...prev, transactions: [newTx, ...prev.transactions] }));
        setTxTitle('');
        setTxAmount('');
        setTxNote('');
        setShowAddTxModal(false);
      };

      const handleDeleteTx = (id) => {
        if (confirm('Bạn có chắc chắn muốn xóa giao dịch này? Số dư và các chỉ số tài chính liên quan sẽ tự động được hoàn tác.')) {
          setState(prev => ({ ...prev, transactions: prev.transactions.filter(t => t.id !== id) }));
        }
      };

      const handleExecuteSchedule = (sch) => {
        const actualAmt = prompt(`Xác nhận số tiền thực tế cho: "${sch.name}"`, sch.amount);
        if (actualAmt === null) return;
        const finalAmt = parseNumber(actualAmt);
        if (finalAmt <= 0) return;

        const newTx = {
          id: Date.now(),
          title: sch.name,
          amount: finalAmt,
          type: sch.type === 'statement_pay' ? 'statement_pay' : sch.type,
          cat: sch.type === 'income' ? 'Chồng chuyển' : (sch.type === 'statement_pay' ? 'Sinh hoạt gia đình (Ăn uống, Chợ, Điện nước)' : 'Bé đi học Green (Học phí, Tiền ăn, CSVC...)'),
          accountId: 'acc_bank',
          fromAccountId: 'acc_bank',
          toAccountId: sch.type === 'statement_pay' ? 'acc_credit' : undefined,
          fundId: sch.fundId,
          monthKey: selectedMonth,
          date: getTodayDateStr(),
          note: `Thực hiện từ kế hoạch dự kiến: ${sch.name}`
        };

        setState(prev => ({
          ...prev,
          transactions: [newTx, ...prev.transactions],
          schedules: prev.schedules.map(s => s.id === sch.id ? { ...s, status: 'completed' } : s)
        }));

        alert('Đã tạo giao dịch thực tế thành công và cập nhật trạng thái kế hoạch!');
      };

      const handleExportBackup = () => {
        const backupData = { ...state, lastBackupDate: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SaoLuu_TaiChinhGiaDinh_${selectedMonth}_${Date.now()}.json`;
        a.click();
        setState(prev => ({ ...prev, lastBackupDate: new Date().toLocaleDateString('vi-VN') }));
      };

      const handleExportCSV = () => {
        let csv = 'ID,Ngay,Noi_Dung,So_Tien,Loai,Danh_Muc,Tai_Khoan,Ky_Thang,Ghi_Chu\n';
        currentMonthTxs.forEach(t => {
          const row = [
            t.id,
            `"${t.date || ''}"`,
            `"${(t.title || '').replace(/"/g, '""')}"`,
            t.amount,
            t.type,
            `"${t.cat || ''}"`,
            `"${t.accountId || t.fromAccountId || ''}"`,
            t.monthKey,
            `"${(t.note || '').replace(/"/g, '""')}"`
          ].join(',');
          csv += row + '\n';
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `GiaoDich_${selectedMonth}.csv`;
        a.click();
      };

      const handleImportBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (!parsed || (!parsed.transactions && !parsed.monthlyBudgets)) {
              alert('File không đúng cấu trúc sao lưu của ứng dụng!');
              return;
            }

            const isReplace = confirm('Bạn muốn: BẤM OK ĐỂ GỘP DỮ LIỆU (Giữ dữ liệu hiện tại và thêm các khoản mới chưa có)\nhoặc BẤM CANCEL ĐỂ THAY THẾ TOÀN BỘ (Làm mới hoàn toàn theo file sao lưu)');

            if (isReplace) {
              const existingIds = new Set(state.transactions.map(t => t.id));
              const newTxs = (parsed.transactions || []).filter(t => !existingIds.has(t.id));
              setState(prev => ({ ...prev, transactions: [...prev.transactions, ...newTxs] }));
              alert(`Gộp thành công thêm ${newTxs.length} giao dịch mới!`);
            } else {
              const finalConfirm = confirm('⚠️ BẠN CÓ CHẮC CHẮN MUỐN THAY THẾ TOÀN BỘ DỮ LIỆU HIỆN TẠI? Hành động này sẽ ghi đè toàn bộ sổ.');
              if (finalConfirm) {
                setState(parsed);
                alert('Đã nạp và khôi phục dữ liệu thành công!');
              }
            }
          } catch (err) {
            alert('Lỗi đọc file JSON: ' + err.message);
          }
        };
        reader.readAsText(file);
      };

      const handleUpdateAccountBalance = (accId, newBal) => {
        const amt = parseNumber(newBal);
        setState(prev => ({
          ...prev,
          accounts: prev.accounts.map(a => a.id === accId ? { ...a, initialBalance: amt } : a)
        }));
      };

      const monthLabel = `Tháng ${selectedMonth.split('-')[1]}/${selectedMonth.split('-')[0]}`;

      return (
        <div className="flex h-screen w-full bg-[#f8fafc] text-slate-800 overflow-hidden">
          <aside className="w-64 bg-white border-r border-slate-200/80 hidden md:flex flex-col flex-shrink-0 z-20">
            <div className="p-5 flex items-center justify-between border-b border-slate-100">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-md shadow-emerald-500/20 font-black text-lg">
                  💎
                </div>
                <div>
                  <h1 className="font-bold text-slate-900 text-sm leading-tight">Quản Lý Tài Chính</h1>

                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Ngày giao dịch</label>
                      <input type="text" value={txDate} onChange={(e) => setTxDate(e.target.value)} placeholder="DD/MM/YYYY" className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold outline-none" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Ghi chú (Tùy chọn)</label>
                      <input type="text" placeholder="VD: Mua quà biếu..." value={txNote} onChange={(e) => setTxNote(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold outline-none" />
                    </div>
                  </div>

                  <div className="pt-2 flex gap-3">
                    <button type="button" onClick={() => setShowAddTxModal(false)} className="flex-1 py-2.5 rounded-xl font-bold text-slate-500 bg-slate-100 text-sm">Hủy Bỏ</button>
                    <button type="submit" className="flex-1 py-2.5 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-700 text-sm shadow-md shadow-emerald-500/20">Lưu Giao Dịch</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
