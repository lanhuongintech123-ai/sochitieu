<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Sổ Chi Tiêu Gia Đình</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Be Vietnam Pro', -apple-system, sans-serif;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const STORAGE_KEY = 'GIA_DINH_CHI_TIEU_BLANK_V2';

    const getCurrentMonthKey = () => {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      return `${d.getFullYear()}-${m}`;
    };

    const DEFAULT_DATA = {
      categoryBudgets: {
        'Ăn uống & Đi chợ': 5000000,
        'Em bé & Con cái': 4000000,
        'Điện nước & Dịch vụ': 2000000,
        'Chi tiêu cá nhân': 1500000,
        'Dự phòng phát sinh': 1500000
      },
      monthlyBudgets: {},
      transactions: [],
      categoriesInfo: [
        { name: 'Ăn uống & Đi chợ', color: '#f97316' },
        { name: 'Em bé & Con cái', color: '#ec4899' },
        { name: 'Điện nước & Dịch vụ', color: '#3b82f6' },
        { name: 'Chi tiêu cá nhân', color: '#6366f1' },
        { name: 'Dự phòng phát sinh', color: '#10b981' }
      ]
    };

    const formatVND = (n) => new Intl.NumberFormat('vi-VN').format(n || 0) + ' ₫';

    function App() {
      const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthKey);
      const [state, setState] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return DEFAULT_DATA;
      });

      const [activeTab, setActiveTab] = useState('overview');
      const [showAddModal, setShowAddModal] = useState(false);

      // CÁC TRẠNG THÁI BỘ LỌC CHI TIÊU
      const [filterSearch, setFilterSearch] = useState('');
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [filterMethod, setFilterMethod] = useState('ALL');
      const [filterSort, setFilterSort] = useState('newest');

      // Form thêm giao dịch
      const [newTitle, setNewTitle] = useState('');
      const [newAmount, setNewAmount] = useState('');
      const [newCat, setNewCat] = useState('Ăn uống & Đi chợ');
      const [newMethod, setNewMethod] = useState('Tiền mặt');

      // Form nhóm danh mục
      const [newCatName, setNewCatName] = useState('');
      const [newCatBudget, setNewCatBudget] = useState('');

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }, [state]);

      // Hạn mức theo tháng
      const currentMonthBudgetMap = useMemo(() => {
        return state.monthlyBudgets[selectedMonth] || state.categoryBudgets;
      }, [state.monthlyBudgets, state.categoryBudgets, selectedMonth]);

      // Tổng ngân sách dự kiến của kỳ
      const currentTotalBudget = useMemo(() => {
        return Object.values(currentMonthBudgetMap).reduce((sum, v) => sum + (parseFloat(v) || 0), 0);
      }, [currentMonthBudgetMap]);

      // Toàn bộ giao dịch thuộc tháng được chọn
      const monthTransactions = useMemo(() => {
        return state.transactions.filter(t => t.monthKey === selectedMonth);
      }, [state.transactions, selectedMonth]);

      // LỌC DANH SÁCH GIAO DỊCH DỰA THEO TÌM KIẾM, NHÓM, PHƯƠNG THỨC & SẮP XẾP
      const filteredTransactions = useMemo(() => {
        return monthTransactions
          .filter(t => {
            const matchesSearch = t.title.toLowerCase().includes(filterSearch.toLowerCase().trim());
            const matchesCat = filterCategory === 'ALL' || t.cat === filterCategory;
            const matchesMethod = filterMethod === 'ALL' || t.method === filterMethod;
            return matchesSearch && matchesCat && matchesMethod;
          })
          .sort((a, b) => {
            if (filterSort === 'newest') return b.id - a.id;
            if (filterSort === 'oldest') return a.id - b.id;
            if (filterSort === 'amount_desc') return b.amount - a.amount;
            if (filterSort === 'amount_asc') return a.amount - b.amount;
            return 0;
          });
      }, [monthTransactions, filterSearch, filterCategory, filterMethod, filterSort]);

      // Tổng tiền của các khoản đang được lọc ra
      const filteredTotalAmount = useMemo(() => {
        return filteredTransactions.reduce((sum, t) => sum + t.amount, 0);
      }, [filteredTransactions]);

      // Tổng chi thực tế trong cả tháng
      const totalSpent = useMemo(() => {
        return monthTransactions.reduce((acc, t) => acc + t.amount, 0);
      }, [monthTransactions]);

      const remainingBudget = Math.max(0, currentTotalBudget - totalSpent);

      const paymentStats = useMemo(() => {
        const cash = monthTransactions.filter(t => t.method === 'Tiền mặt').reduce((s, t) => s + t.amount, 0);
        const credit = monthTransactions.filter(t => t.method === 'Thẻ tín dụng').reduce((s, t) => s + t.amount, 0);
        const transfer = monthTransactions.filter(t => t.method === 'Chuyển khoản').reduce((s, t) => s + t.amount, 0);
        return { cash, credit, transfer };
      }, [monthTransactions]);

      const categoryStats = useMemo(() => {
        return state.categoriesInfo.map(cat => {
          const budget = currentMonthBudgetMap[cat.name] || 0;
          const spent = monthTransactions
            .filter(t => t.cat === cat.name)
            .reduce((sum, t) => sum + t.amount, 0);
          return {
            ...cat,
            budget,
            spent,
            percent: budget > 0 ? Math.min(100, Math.round((spent / budget) * 100)) : 0
          };
        });
      }, [state.categoriesInfo, currentMonthBudgetMap, monthTransactions]);

      const handleAddTx = (e) => {
        e.preventDefault();
        const amt = parseFloat(newAmount);
        if (!newTitle || isNaN(amt) || amt <= 0) return;

        const newTx = {
          id: Date.now(),
          title: newTitle.trim(),
          amount: amt,
          cat: newCat,
          method: newMethod,
          monthKey: selectedMonth,
          createdAt: new Date().toLocaleDateString('vi-VN')
        };

        setState(prev => ({
          ...prev,
          transactions: [newTx, ...prev.transactions]
        }));

        setNewTitle('');
        setNewAmount('');
        setShowAddModal(false);
      };

      const handleDeleteTx = (id) => {
        if (confirm('Bạn có chắc muốn xóa khoản chi này?')) {
          setState(prev => ({
            ...prev,
            transactions: prev.transactions.filter(t => t.id !== id)
          }));
        }
      };

      const handleUpdateMonthBudget = (catName, newVal) => {
        const val = parseFloat(newVal) || 0;
        setState(prev => {
          const currentMap = prev.monthlyBudgets[selectedMonth] || { ...prev.categoryBudgets };
          return {
            ...prev,
            monthlyBudgets: {
              ...prev.monthlyBudgets,
              [selectedMonth]: {
                ...currentMap,
                [catName]: val
              }
            }
          };
        });
      };

      const handleAddNewCategory = (e) => {
        e.preventDefault();
        if (!newCatName.trim()) return;
        const budgetVal = parseFloat(newCatBudget) || 0;
        const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);

        setState(prev => ({
          ...prev,
          categoriesInfo: [...prev.categoriesInfo, { name: newCatName.trim(), color: randomColor }],
          categoryBudgets: { ...prev.categoryBudgets, [newCatName.trim()]: budgetVal }
        }));

        setNewCatName('');
        setNewCatBudget('');
      };

      const exportJson = () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SoThuChi_${selectedMonth}.json`;
        a.click();
      };

      const importJson = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed && Array.isArray(parsed.transactions)) {
              setState(parsed);
              alert('Nạp dữ liệu thành công!');
            }
          } catch (err) {
            alert('File sao lưu không hợp lệ!');
          }
        };
        reader.readAsText(file);
      };

      const monthLabel = `Tháng ${selectedMonth.split('-')[1]}/${selectedMonth.split('-')[0]}`;

      return (
        <div className="flex h-screen w-full bg-[#f8fafc] text-slate-800 overflow-hidden">
          
          {/* SIDEBAR MÁY TÍNH */}
          <aside className="w-64 bg-white border-r border-slate-200/80 hidden md:flex flex-col flex-shrink-0 z-20">
            <div className="p-5 flex items-center gap-3 border-b border-slate-100">
              <div className="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
              </div>
              <div>
                <h1 className="font-bold text-slate-900 text-base leading-tight">Sổ Thu Chi</h1>
                <span className="text-[11px] font-semibold text-emerald-600">Gia Đình</span>
              </div>
            </div>

            <div className="px-5 pt-4 pb-2">
              <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Kỳ Báo Cáo</label>
              <input 
                type="month"
                value={selectedMonth}
                onChange={(e) => setSelectedMonth(e.target.value)}
                className="w-full bg-slate-50 border border-slate-200 text-slate-800 font-bold text-sm rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-500/30"
              />
            </div>

            <nav className="p-3 space-y-1.5 flex-1">
              <button 
                onClick={() => setActiveTab('overview')} 
                className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-semibold text-sm transition-colors ${activeTab === 'overview' ? 'bg-emerald-50 text-emerald-700' : 'text-slate-600 hover:bg-slate-50'}`}
              >
                <span>📊 Tổng Quan & Sổ Chi</span>
              </button>

              <button 
                onClick={() => setActiveTab('settings')} 
                className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-semibold text-sm transition-colors ${activeTab === 'settings' ? 'bg-emerald-50 text-emerald-700' : 'text-slate-600 hover:bg-slate-50'}`}
              >
                <span>⚙️ Thiết Lập Ngân Sách</span>
              </button>

              <button 
                onClick={() => setActiveTab('sync')} 
                className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-semibold text-sm transition-colors ${activeTab === 'sync' ? 'bg-emerald-50 text-emerald-700' : 'text-slate-600 hover:bg-slate-50'}`}
              >
                <span>🔄 Sao Lưu & Đồng Bộ</span>
              </button>
            </nav>
          </aside>

          {/* MAIN CONTENT */}
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <header className="h-16 bg-white border-b border-slate-200/80 flex items-center justify-between px-4 sm:px-8 flex-shrink-0 z-10">
              <div className="flex items-center gap-3">
                <h2 className="text-xl font-bold text-slate-900 tracking-tight">
                  {activeTab === 'overview' && 'Tổng Quan Thu Chi'}
                  {activeTab === 'settings' && 'Thiết Lập Ngân Sách'}
                  {activeTab === 'sync' && 'Sao Lưu & Đồng Bộ'}
                </h2>
                <span className="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200/50">
                  {monthLabel}
                </span>
              </div>
              <button 
                onClick={() => setShowAddModal(true)}
                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-xl flex items-center gap-2 shadow-sm transition-all"
              >
                <span>+ Ghi Khoản Chi</span>
              </button>
            </header>

            <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6 pb-24 md:pb-8">

              {activeTab === 'overview' && (
                <>
                  {/* 4 CARD KPI */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
                    
                    <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                      <span className="text-xs font-bold text-slate-400 uppercase">Ngân Sách Còn Lại</span>
                      <div className="text-2xl font-black text-emerald-600 tracking-tight mt-2.5">{formatVND(remainingBudget)}</div>
                      <div className="text-xs text-slate-400 font-medium mt-1">Hạn mức còn của {monthLabel}</div>
                    </div>

                    <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                      <span className="text-xs font-bold text-slate-400 uppercase">Đã Chi Trong Tháng</span>
                      <div className="text-2xl font-black text-rose-600 tracking-tight mt-2.5">{formatVND(totalSpent)}</div>
                      <div className="text-xs text-slate-400 font-medium mt-1">Tổng tiền thực tế đã xuất</div>
                    </div>

                    <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                      <span className="text-xs font-bold text-slate-400 uppercase">Chi Bằng Thẻ Tín Dụng</span>
                      <div className="text-2xl font-black text-blue-600 tracking-tight mt-2.5">{formatVND(paymentStats.credit)}</div>
                      <div className="text-xs text-slate-400 font-medium mt-1">Cần thanh toán sao kê</div>
                    </div>

                    <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm flex flex-col justify-between">
                      <span className="text-xs font-bold text-slate-400 uppercase">Tiến Độ Tiêu Dùng</span>
                      <div className="text-2xl font-black text-slate-900 tracking-tight mt-2.5">
                        {currentTotalBudget > 0 ? Math.round((totalSpent / currentTotalBudget) * 100) : 0}%
                      </div>
                      <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden mt-2.5">
                        <div 
                          className="bg-emerald-500 h-full rounded-full transition-all" 
                          style={{ width: `${currentTotalBudget > 0 ? Math.min(100, Math.round((totalSpent / currentTotalBudget) * 100)) : 0}%` }}
                        />
                      </div>
                    </div>

                  </div>

                  {/* TIẾN ĐỘ & PHƯƠNG THỨC */}
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm lg:col-span-2">
                      <div className="flex items-center justify-between mb-4">
                        <h3 className="font-bold text-slate-900 text-base">Hạn Mức Nhóm Chi ({monthLabel})</h3>
                        <button 
                          onClick={() => setActiveTab('settings')}
                          className="text-xs font-bold text-emerald-600 bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-lg"
                        >
                          ⚙️ Cài đặt ngân sách
                        </button>
                      </div>

                      <div className="space-y-4">
                        {categoryStats.map(c => (
                          <div key={c.name} className="p-3.5 rounded-xl border border-slate-100 bg-slate-50/50">
                            <div className="flex justify-between items-center text-sm font-semibold mb-1.5">
                              <span className="text-slate-800">{c.name}</span>
                              <span className="text-slate-500 text-xs">
                                Đã tiêu: <b className="text-slate-800">{formatVND(c.spent)}</b> / {formatVND(c.budget)}
                              </span>
                            </div>
                            <div className="w-full bg-slate-200/70 h-2 rounded-full overflow-hidden">
                              <div 
                                className="h-full rounded-full transition-all"
                                style={{ width: `${c.percent}%`, backgroundColor: c.percent > 90 ? '#ef4444' : c.color }}
                              />
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                      <div>
                        <h3 className="font-bold text-slate-900 text-base mb-4">Phương Thức Thanh Toán</h3>
                        <div className="space-y-3">
                          <div className="p-3.5 rounded-xl border border-slate-100 bg-slate-50 flex items-center justify-between">
                            <span className="font-bold text-slate-800 text-sm">💵 Tiền mặt</span>
                            <span className="font-black text-slate-900 text-sm">{formatVND(paymentStats.cash)}</span>
                          </div>
                          <div className="p-3.5 rounded-xl border border-slate-100 bg-slate-50 flex items-center justify-between">
                            <span className="font-bold text-slate-800 text-sm">💳 Thẻ tín dụng</span>
                            <span className="font-black text-rose-600 text-sm">{formatVND(paymentStats.credit)}</span>
                          </div>
                          <div className="p-3.5 rounded-xl border border-slate-100 bg-slate-50 flex items-center justify-between">
                            <span className="font-bold text-slate-800 text-sm">🏦 Chuyển khoản</span>
                            <span className="font-black text-slate-900 text-sm">{formatVND(paymentStats.transfer)}</span>
                          </div>
                        </div>
                      </div>
                      <div className="mt-4 pt-3 border-t border-slate-100 text-xs text-slate-400">
                        * Tự động tổng hợp theo các khoản chi trong kỳ.
                      </div>
                    </div>
                  </div>

                  {/* KHU VỰC DANH SÁCH CHI TIÊU & BỘ LỌC NÂNG CAO */}
                  <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    
                    {/* TIÊU ĐỀ & THANH CÔNG CỤ LỌC */}
                    <div className="p-5 border-b border-slate-100 space-y-4">
                      
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div className="flex items-center gap-2.5">
                          <h3 className="font-bold text-slate-900 text-base">
                            Chi Tiết Khoản Chi ({monthLabel})
                          </h3>
                          <span className="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200/60 px-2.5 py-0.5 rounded-full">
                            {filteredTransactions.length} / {monthTransactions.length} mục
                          </span>
                        </div>

                        <div className="flex items-center gap-2">
                          {/* Hiển thị tổng tiền các khoản sau lọc */}
                          <div className="text-xs text-slate-500 font-semibold bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200/60">
                            Tổng lọc: <span className="text-rose-600 font-black">{formatVND(filteredTotalAmount)}</span>
                          </div>
                          <button 
                            onClick={() => setShowAddModal(true)} 
                            className="text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 px-3 py-1.5 rounded-xl transition-all"
                          >
                            + Thêm chi tiêu
                          </button>
                        </div>
                      </div>

                      {/* THANH BỘ LỌC TÌM KIẾM, DANH MỤC, PHƯƠNG THỨC & SẮP XẾP */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 pt-1">
                        
                        {/* 1. Tìm kiếm theo tên */}
                        <div className="relative">
                          <input 
                            type="text"
                            placeholder="🔍 Tìm theo tên món..."
                            value={filterSearch}
                            onChange={(e) => setFilterSearch(e.target.value)}
                            className="w-full pl-3 pr-8 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
                          />
                          {filterSearch && (
                            <button 
                              onClick={() => setFilterSearch('')}
                              className="absolute right-2.5 top-2 text-slate-400 hover:text-slate-600 text-xs"
                            >
                              ✕
                            </button>
                          )}
                        </div>

                        {/* 2. Lọc theo Nhóm chi tiêu */}
                        <select 
                          value={filterCategory}
                          onChange={(e) => setFilterCategory(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
                        >
                          <option value="ALL">📁 Tất cả các nhóm</option>
                          {state.categoriesInfo.map(c => (
                            <option key={c.name} value={c.name}>{c.name}</option>
                          ))}
                        </select>

                        {/* 3. Lọc theo Phương thức thanh toán */}
                        <select 
                          value={filterMethod}
                          onChange={(e) => setFilterMethod(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
                        >
                          <option value="ALL">💳 Tất cả phương thức</option>
                          <option value="Tiền mặt">💵 Tiền mặt</option>
                          <option value="Thẻ tín dụng">💳 Thẻ tín dụng</option>
                          <option value="Chuyển khoản">🏦 Chuyển khoản</option>
                        </select>

                        {/* 4. Sắp xếp danh sách */}
                        <select 
                          value={filterSort}
                          onChange={(e) => setFilterSort(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
                        >
                          <option value="newest">🕒 Mới nhất trước</option>
                          <option value="oldest">🕒 Cũ nhất trước</option>
                          <option value="amount_desc">💰 Tiền nhiều nhất</option>
                          <option value="amount_asc">💰 Tiền ít nhất</option>
                        </select>

                      </div>

                      {/* Nút reset bộ lọc nếu có tiêu chí lọc */}
                      {(filterSearch || filterCategory !== 'ALL' || filterMethod !== 'ALL' || filterSort !== 'newest') && (
                        <div className="flex items-center justify-between text-xs pt-1">
                          <span className="text-slate-400">Đang áp dụng bộ lọc tùy chỉnh</span>
                          <button 
                            onClick={() => {
                              setFilterSearch('');
                              setFilterCategory('ALL');
                              setFilterMethod('ALL');
                              setFilterSort('newest');
                            }}
                            className="text-emerald-600 hover:underline font-bold"
                          >
                            Xóa tất cả bộ lọc ↺
                          </button>
                        </div>
                      )}

                    </div>

                    {/* DANH SÁCH CÁC KHOẢN CHI SAU KHI LỌC */}
                    {filteredTransactions.length === 0 ? (
                      <div className="p-12 text-center text-slate-400 text-sm space-y-1">
                        <p className="font-semibold text-slate-600">Không tìm thấy khoản chi tiêu nào phù hợp!</p>
                        <p className="text-xs">Hãy thử đổi từ khóa tìm kiếm hoặc chọn lại nhóm danh mục lọc.</p>
                      </div>
                    ) : (
                      <div className="divide-y divide-slate-100">
                        {filteredTransactions.map((tx) => (
                          <div key={tx.id} className="p-4 sm:px-6 flex items-center justify-between hover:bg-slate-50 transition-colors">
                            <div className="flex items-center gap-3 min-w-0">
                              <div className="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center flex-shrink-0 text-base font-bold">
                                {tx.method === 'Thẻ tín dụng' ? '💳' : tx.method === 'Chuyển khoản' ? '🏦' : '💵'}
                              </div>
                              <div className="min-w-0">
                                <p className="font-bold text-slate-900 text-sm truncate">{tx.title}</p>
                                <div className="flex items-center gap-2 text-xs text-slate-400 mt-0.5">
                                  <span className="font-semibold text-slate-600">{tx.cat}</span>
                                  <span>•</span>
                                  <span className="px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-semibold text-[11px]">{tx.method}</span>
                                  {tx.createdAt && (
                                    <>
                                      <span>•</span>
                                      <span className="text-[11px] text-slate-400">{tx.createdAt}</span>
                                    </>
                                  )}
                                </div>
                              </div>
                            </div>

                            <div className="flex items-center gap-4 flex-shrink-0">
                              <span className="font-black text-rose-600 text-sm sm:text-base">
                                -{formatVND(tx.amount)}
                              </span>
                              <button 
                                onClick={() => handleDeleteTx(tx.id)}
                                className="text-slate-300 hover:text-rose-500 p-1.5 rounded-lg hover:bg-rose-50 transition-colors"
                                title="Xóa khoản này"
                              >
                                ✕
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </>
              )}

              {/* TAB THIẾT LẬP NGÂN SÁCH */}
              {activeTab === 'settings' && (
                <div className="max-w-2xl mx-auto space-y-6">
                  <div className="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                    <div>
                      <h3 className="text-lg font-bold text-slate-900">Thiết Lập Ngân Sách Cho {monthLabel}</h3>
                      <p className="text-sm text-slate-500 mt-1">Cài đặt số tiền tối đa cho từng nhóm chi tiêu trong gia đình.</p>
                    </div>

                    <div className="space-y-4">
                      {state.categoriesInfo.map(c => (
                        <div key={c.name} className="flex items-center justify-between gap-3 p-3.5 rounded-xl border border-slate-100 bg-slate-50/60">
                          <div className="flex items-center gap-2.5">
                            <span className="w-3 h-3 rounded-full" style={{ backgroundColor: c.color }}></span>
                            <span className="font-bold text-slate-800 text-sm">{c.name}</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <input 
                              type="number"
                              value={currentMonthBudgetMap[c.name] ?? ''}
                              onChange={(e) => handleUpdateMonthBudget(c.name, e.target.value)}
                              placeholder="0"
                              className="px-3 py-1.5 rounded-lg border border-slate-200 text-sm font-bold text-slate-900 w-36 text-right focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
                            />
                            <span className="text-sm font-semibold text-slate-500">₫</span>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="p-4 rounded-xl bg-emerald-50 text-emerald-900 font-bold flex justify-between items-center text-sm">
                      <span>Tổng Ngân Sách Dự Kiến:</span>
                      <span className="text-lg font-black text-emerald-700">{formatVND(currentTotalBudget)}</span>
                    </div>
                  </div>

                  {/* THÊM NHÓM DANH MỤC MỚI */}
                  <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                    <h4 className="font-bold text-slate-900 text-sm">Thêm Nhóm Chi Tiêu Mới</h4>
                    <form onSubmit={handleAddNewCategory} className="flex flex-col sm:flex-row gap-3">
                      <input 
                        type="text"
                        placeholder="Tên nhóm (VD: Xăng xe, Học phí...)"
                        value={newCatName}
                        onChange={(e) => setNewCatName(e.target.value)}
                        className="flex-1 px-3.5 py-2 rounded-xl border border-slate-200 text-sm font-semibold outline-none"
                      />
                      <input 
                        type="number"
                        placeholder="Ngân sách (VNĐ)"
                        value={newCatBudget}
                        onChange={(e) => setNewCatBudget(e.target.value)}
                        className="w-full sm:w-40 px-3.5 py-2 rounded-xl border border-slate-200 text-sm font-semibold outline-none"
                      />
                      <button 
                        type="submit"
                        className="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-sm"
                      >
                        Thêm
                      </button>
                    </form>
                  </div>
                </div>
              )}

              {/* TAB ĐỒNG BỘ & SAO LƯU */}
              {activeTab === 'sync' && (
                <div className="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                  <div>
                    <h3 className="text-lg font-bold text-slate-900">Sao Lưu & Nạp Dữ Liệu</h3>
                    <p className="text-sm text-slate-500 mt-1">Xuất file để chuyển sang thiết bị khác hoặc lưu trữ an toàn.</p>
                  </div>

                  <div className="flex flex-col sm:flex-row gap-3 pt-2">
                    <button 
                      onClick={exportJson}
                      className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow-sm"
                    >
                      📁 Tải File Sao Lưu (.json)
                    </button>
                    
                    <label className="flex-1 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-sm text-center cursor-pointer">
                      📥 Nạp File Vào Ứng Dụng
                      <input type="file" accept=".json" onChange={importJson} className="hidden" />
                    </label>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* BOTTOM BAR CHO IPHONE */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-white border-t border-slate-200 px-4 flex items-center justify-around z-30 shadow-lg">
            <button 
              onClick={() => setActiveTab('overview')} 
              className={`flex flex-col items-center gap-1 ${activeTab === 'overview' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base">📊</span>
              <span className="text-[10px]">Kỳ này</span>
            </button>

            <button 
              onClick={() => setShowAddModal(true)} 
              className="w-12 h-12 -mt-5 rounded-full bg-emerald-600 text-white flex items-center justify-center shadow-lg font-bold text-xl active:scale-95"
            >
              +
            </button>

            <button 
              onClick={() => setActiveTab('settings')} 
              className={`flex flex-col items-center gap-1 ${activeTab === 'settings' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base">⚙️</span>
              <span className="text-[10px]">Ngân sách</span>
            </button>

            <button 
              onClick={() => setActiveTab('sync')} 
              className={`flex flex-col items-center gap-1 ${activeTab === 'sync' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}
            >
              <span className="text-base">🔄</span>
              <span className="text-[10px]">Sao lưu</span>
            </button>
          </nav>

          {/* MODAL THÊM KHOẢN CHI */}
          {showAddModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="font-bold text-slate-900 text-lg">Ghi Khoản Chi ({monthLabel})</h3>
                  <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-slate-600">
                    ✕
                  </button>
                </div>

                <form onSubmit={handleAddTx} className="space-y-4 pt-2">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Nội dung chi</label>
                    <input 
                      type="text" 
                      placeholder="VD: Mua sữa chua, thịt bò, rau củ..."
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                      required
                      className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold outline-none focus:ring-2 focus:ring-emerald-500/30"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Số tiền (VNĐ)</label>
                    <input 
                      type="number" 
                      placeholder="VD: 50000"
                      value={newAmount}
                      onChange={(e) => setNewAmount(e.target.value)}
                      required
                      className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold outline-none focus:ring-2 focus:ring-emerald-500/30"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Nhóm chi tiêu</label>
                      <select 
                        value={newCat} 
                        onChange={(e) => setNewCat(e.target.value)}
                        className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold bg-white outline-none"
                      >
                        {state.categoriesInfo.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Phương thức</label>
                      <select 
                        value={newMethod} 
                        onChange={(e) => setNewMethod(e.target.value)}
                        className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold bg-white outline-none"
                      >
                        <option value="Tiền mặt">Tiền mặt</option>
                        <option value="Thẻ tín dụng">Thẻ tín dụng</option>
                        <option value="Chuyển khoản">Chuyển khoản</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-2 flex gap-3">
                    <button 
                      type="button" 
                      onClick={() => setShowAddModal(false)}
                      className="flex-1 py-2.5 rounded-xl font-bold text-slate-500 bg-slate-100 text-sm"
                    >
                      Hủy
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 py-2.5 rounded-xl font-bold text-white bg-emerald-600 text-sm shadow-md"
                    >
                      Lưu Giao Dịch
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
